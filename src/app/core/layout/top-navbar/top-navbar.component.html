<nav class="qd-navbar" role="navigation" aria-label="التنقل الرئيسي">
  <a class="brand" routerLink="/">
    <span class="qd-page-title">المنهج القرآني</span>
  </a>

  <ul class="nav-links desktop-nav">
    <li *ngFor="let item of primaryItems" class="nav-item">
      <a
        class="qd-btn qd-btn-ghost nav-link"
        [routerLink]="item.route"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
      >
        {{ item.labelAr }}
      </a>
    </li>
    <li class="nav-item more-dropdown" [class.open]="moreOpen">
      <button
        class="qd-btn qd-btn-ghost nav-link"
        [class.active]="isMoreActive()"
        type="button"
        (click)="toggleMore()"
        aria-haspopup="true"
        aria-controls="more-menu"
        [attr.aria-expanded]="moreOpen"
      >
        المزيد
        <svg class="chevron" width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true" focusable="false">
          <path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <ul id="more-menu" class="dropdown-menu" *ngIf="moreOpen">
        <li *ngFor="let item of moreItems">
          <a
            class="qd-btn qd-btn-ghost dropdown-link"
            [routerLink]="item.route"
            routerLinkActive="active"
            (click)="closeMore()"
          >
            {{ item.labelAr }}
          </a>
        </li>
      </ul>
    </li>
  </ul>

  <span class="spacer"></span>

  <div class="actions desktop-nav" aria-label="إجراءات المستخدم">
    <button
      class="qd-btn qd-btn-ghost nav-link theme-toggle"
      type="button"
      [attr.aria-label]="(themeService.isDark$ | async) ? 'الوضع الفاتح' : 'الوضع الداكن'"
      [attr.aria-pressed]="(themeService.isDark$ | async) ? 'true' : 'false'"
      (click)="themeService.toggle()"
    >
      <svg *ngIf="themeService.isDark$ | async" width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true" focusable="false">
        <circle cx="9" cy="9" r="3.5" stroke="currentColor" stroke-width="1.2"/>
        <path d="M9 1v2M9 15v2M1 9h2M15 9h2M3.22 3.22l1.42 1.42M13.36 13.36l1.42 1.42M3.22 14.78l1.42-1.42M13.36 4.64l1.42-1.42" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
      <svg *ngIf="(themeService.isDark$ | async) === false" width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true" focusable="false">
        <path d="M15.1 10.2A6.5 6.5 0 0 1 7.8 2.9a6.5 6.5 0 1 0 7.3 7.3z" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <ng-container *ngFor="let item of actionItems">
      <a
        class="qd-btn qd-btn-ghost nav-link"
        [routerLink]="item.route"
        routerLinkActive="active"
      >
        {{ item.labelAr }}
      </a>
    </ng-container>
  </div>

  <button
    class="qd-btn qd-btn-ghost menu-toggle"
    type="button"
    aria-label="القائمة"
    [attr.aria-expanded]="mobileOpen"
    (click)="toggleMobile()"
  >
    <svg
      width="20"
      height="20"
      viewBox="0 0 20 20"
      fill="none"
      aria-hidden="true"
      focusable="false"
    >
      <path
        d="M3 5h14M3 10h14M3 15h14"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
      />
    </svg>
  </button>
</nav>

<div class="mobile-menu" *ngIf="mobileOpen" role="navigation" aria-label="القائمة" (click)="closeMobile()">
  <div class="mobile-menu-panel" (click)="$event.stopPropagation()">
    <div class="mobile-theme-toggle">
      <button
        class="qd-btn qd-btn-ghost theme-toggle"
        type="button"
        [attr.aria-label]="(themeService.isDark$ | async) ? 'الوضع الفاتح' : 'الوضع الداكن'"
        [attr.aria-pressed]="(themeService.isDark$ | async) ? 'true' : 'false'"
        (click)="themeService.toggle()"
      >
        <svg *ngIf="themeService.isDark$ | async" width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true" focusable="false">
          <circle cx="9" cy="9" r="3.5" stroke="currentColor" stroke-width="1.2"/>
          <path d="M9 1v2M9 15v2M1 9h2M15 9h2M3.22 3.22l1.42 1.42M13.36 13.36l1.42 1.42M3.22 14.78l1.42-1.42M13.36 4.64l1.42-1.42" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
        <svg *ngIf="(themeService.isDark$ | async) === false" width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true" focusable="false">
          <path d="M15.1 10.2A6.5 6.5 0 0 1 7.8 2.9a6.5 6.5 0 1 0 7.3 7.3z" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    <ul class="mobile-menu-list">
      <li *ngFor="let item of allItems">
        <a
          class="qd-btn qd-btn-ghost mobile-link"
          [routerLink]="item.route"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
          (click)="closeMobile()"
        >
          {{ item.labelAr }}
        </a>
      </li>
    </ul>
  </div>
</div>
