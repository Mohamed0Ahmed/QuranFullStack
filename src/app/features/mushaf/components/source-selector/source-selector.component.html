<div class="source-selector" data-testid="source-selector">
  <div class="source-selector__header">
    <span class="source-selector__label">{{ label() }}</span>
    @if (usedLabel()) {
      <span class="source-selector__used" data-testid="source-used-label">{{ usedLabel() }}</span>
    }
  </div>
  @if (options().length > 0) {
    <div class="source-selector__options" role="listbox" [attr.aria-label]="label()">
      @for (option of options(); track option.key) {
        <button
          type="button"
          class="source-selector__option"
          [class.source-selector__option--active]="option.key === selectedKey()"
          role="option"
          [attr.aria-selected]="option.key === selectedKey()"
          (click)="sourceChange.emit(option.key)"
        >
          {{ option.label }}
        </button>
      }
    </div>
  }
</div>
