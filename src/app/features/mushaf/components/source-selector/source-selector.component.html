<div class="source-selector" data-testid="source-selector">
  <div class="source-selector__header">
    <span class="source-selector__label">{{ label() }}</span>
    @if (usedLabel()) {
      <span class="source-selector__used" data-testid="source-used-label">{{ usedLabel() }}</span>
    }
  </div>
  @if (options().length > 1) {
  <label class="source-selector__field">
    <span class="sr-only">{{ label() }}</span>
    <select
      class="qd-select source-selector__select"
      [attr.aria-label]="label()"
      [value]="selectedKey() ?? ''"
      (change)="onSelectChange($event)"
    >
      @if (useGroupedSelect()) {
        @for (group of optionGroups(); track group.languageNameAr) {
          <optgroup [label]="group.languageNameAr!">
            @for (option of group.options; track option.key) {
              <option [value]="option.key">{{ option.label }}</option>
            }
          </optgroup>
        }
      } @else {
        @for (option of options(); track option.key) {
          <option [value]="option.key">{{ option.label }}</option>
        }
      }
    </select>
  </label>
  } @else if (options().length === 1) {
    <span class="source-selector__single" data-testid="source-single-option">{{ options()[0].label }}</span>
  }
</div>
