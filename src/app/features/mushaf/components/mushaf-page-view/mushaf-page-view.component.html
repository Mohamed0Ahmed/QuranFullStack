<div class="mushaf-page-view" data-testid="mushaf-page-view">
  @for (line of page().lines; track line.lineNumber) {
    <qd-mushaf-line
      [line]="line"
      [markers]="page().markers"
      [selectedVerseKey]="selectedVerseKey()"
      [selectedWordLocation]="selectedWordLocation()"
      (ayahSelect)="ayahSelect.emit($event)"
      (wordSelect)="wordSelect.emit($event)"
    />
  }
</div>
