@if (!entry()) {
  <div class="qd-empty-state" role="status" data-testid="full-i3rab-empty">
    <span>لا يتوفر إعراب كامل لهذه الآية من المصدر المحدد.</span>
  </div>
} @else {
  <article class="study-card" data-testid="full-i3rab-card">
    @if (entry()!.coveredAyahCount > 1) {
      <p class="study-card__coverage" data-testid="grouped-coverage">
        يغطي هذا الإعراب الآيات: {{ coverageAyahNumbers() }}
      </p>
    }
    <div class="study-card__body" dir="rtl" [innerHTML]="entry()!.html | safeHtml"></div>
  </article>
}
