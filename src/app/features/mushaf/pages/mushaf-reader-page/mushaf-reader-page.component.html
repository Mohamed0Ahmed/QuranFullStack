<div
  class="mushaf-reader"
  [ngClass]="panelClass(facade.panel())"
  dir="rtl"
>
  <section class="mushaf-reader__page" aria-label="منطقة المصحف">
    <qd-mushaf-page-area
      [page]="facade.page()"
      [loadState]="facade.pageLoadState()"
      [surahCatalog]="facade.surahCatalog()"
      [selectedVerseKey]="facade.selectedAyahKey()"
      [selectedWordLocation]="facade.selectedWordLocation()"
      (pageChange)="onPageChange($event)"
      (surahJump)="onSurahJump($event)"
      (ayahSelect)="onAyahSelect($event)"
      (wordSelect)="onWordSelect($event)"
    />
  </section>
  <section class="mushaf-reader__study" aria-label="منطقة الدراسة">
    <nav class="mushaf-reader__mobile-tabs" aria-label="تبويبات الدراسة">
      <button
        type="button"
        class="qd-btn mushaf-reader__mobile-tab"
        [class.mushaf-reader__mobile-tab--active]="facade.panel() === 'word'"
        (click)="onStudySectionFocus('word')"
      >
        تحليل الكلمة
      </button>
      <button
        type="button"
        class="qd-btn mushaf-reader__mobile-tab"
        [class.mushaf-reader__mobile-tab--active]="facade.panel() === 'ayah'"
        (click)="onStudySectionFocus('ayah')"
      >
        دراسة الآية
      </button>
    </nav>
    <qd-selected-word-section
      class="mushaf-reader__word-study"
      [class.mushaf-reader__word-study--focused]="isPanelFocused('word')"
      [analysis]="facade.wordAnalysis()"
      [loadState]="facade.wordAnalysisLoadState()"
      [activeTab]="facade.wordTab()"
      [selectedWordLocation]="facade.selectedWordLocation()"
      (tabChange)="onWordTabChange($event)"
      (sectionFocus)="onStudySectionFocus('word')"
    />
    <qd-selected-ayah-section
      class="mushaf-reader__ayah-study"
      [class.mushaf-reader__ayah-study--focused]="isPanelFocused('ayah')"
      [study]="facade.ayahStudy()"
      [loadState]="facade.ayahStudyLoadState()"
      [activeTab]="facade.ayahTab()"
      [selectedVerseKey]="facade.selectedAyahKey()"
      [tafsirOptions]="facade.tafsirSourceOptions"
      [translationOptions]="facade.translationSourceOptions"
      [fullI3rabOptions]="facade.fullI3rabSourceOptions"
      (tabChange)="onAyahTabChange($event)"
      (tafsirSourceChange)="onTafsirSourceChange($event)"
      (translationSourceChange)="onTranslationSourceChange($event)"
      (fullI3rabSourceChange)="onFullI3rabSourceChange($event)"
      (sectionFocus)="onStudySectionFocus('ayah')"
    />
  </section>
</div>
