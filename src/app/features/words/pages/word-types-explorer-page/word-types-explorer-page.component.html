<section class="word-types-page" dir="rtl">
  <header class="word-types-page__header">
    <h1>{{ pageTitle }}</h1>
  </header>

  <div class="word-types-page__layout">
    <qd-word-type-filter
      [tree]="listState().tree"
      [selectedType]="listState().query.type"
      [loading]="listState().status === 'loading'"
      (typeSelected)="selectType($event)"
    />

    <main class="word-types-page__main">
      <div class="word-types-page__toolbar">
        <label class="word-types-page__sort">
          <span>{{ sortLabel }}</span>
          <select [value]="listState().query.sort" (change)="changeSort($event)">
            @for (option of sortOptions; track option.value) {
              <option [value]="option.value">{{ option.label }}</option>
            }
          </select>
        </label>
      </div>

      @if (listState().status === 'loading') {
        <p class="qd-loading-state" role="status" aria-live="polite">{{ loadingLabel }}</p>
      }

      @if (listState().status === 'error') {
        <p class="qd-error-state">{{ listState().errorMessage || errorLabel }}</p>
      } @else if (listState().status === 'empty') {
        <p class="qd-empty-state">{{ emptyLabel }}</p>
      }

      <qd-word-types-table
        [rows]="listState().rows"
        [loading]="listState().status === 'loading'"
        [selectedRow]="selectedRow()"
        (rowSelected)="selectRow($event)"
      />

      @if (listState().rows; as page) {
        <qd-pagination
          [currentPage]="page.page"
          [pageSize]="page.pageSize"
          [totalCount]="page.totalCount"
          [disabled]="listState().status === 'loading'"
          [ariaLabel]="tableLabel"
          (pageChange)="changePage($event)"
        />
      }
    </main>

    <qd-word-type-details-panel [state]="panelState()" />
  </div>
</section>
