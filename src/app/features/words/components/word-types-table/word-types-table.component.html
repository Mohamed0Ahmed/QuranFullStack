<section
  class="word-types-table"
  role="table"
  [attr.aria-label]="tableLabel"
  [attr.aria-rowcount]="rows()?.totalCount ?? null"
>
  @if (rows(); as page) {
    <div class="word-types-table__header" role="rowgroup">
      <div class="word-types-table__header-row" role="row">
        <span class="word-types-table__header-cell word-types-table__header-cell--word" role="columnheader">{{ headers.word }}</span>
        <span class="word-types-table__header-cell word-types-table__header-cell--meta" role="columnheader">{{ headers.type }}</span>
        <span class="word-types-table__header-cell word-types-table__header-cell--meta" role="columnheader">{{ headers.root }}</span>
        <span class="word-types-table__header-cell word-types-table__header-cell--meta" role="columnheader">{{ headers.stem }}</span>
        <span class="word-types-table__header-cell word-types-table__header-cell--meta" role="columnheader">{{ headers.lemma }}</span>
        <span class="word-types-table__header-cell word-types-table__header-cell--count" role="columnheader">{{ headers.occurrences }}</span>
        <span class="word-types-table__header-cell word-types-table__header-cell--count" role="columnheader">{{ headers.ayahs }}</span>
        <span class="word-types-table__header-cell word-types-table__header-cell--count" role="columnheader">{{ headers.surahs }}</span>
      </div>
      <div class="word-types-table__header-gutter" aria-hidden="true"></div>
    </div>

    <div class="word-types-table__body" role="rowgroup">
      @for (row of page.items; track row.tashkeelWordId + ':' + row.contextCode) {
        <button
          type="button"
          class="word-types-table__row qd-interactive-surface"
          role="row"
          [attr.data-word-types-row]="row.tashkeelWordId + ':' + row.contextCode + ':' + row.case + ':' + row.tense + ':' + row.voice"
          [class.qd-is-selected]="isSelected(row)"
          [attr.aria-current]="isSelected(row) ? 'true' : null"
          [attr.aria-selected]="isSelected(row)"
          (click)="selectRow(row)"
        >
          <span class="word-types-table__cell word-types-table__cell--word" role="cell">
            <span class="word-types-table__word">{{ row.displayText }}</span>
          </span>
          <span class="word-types-table__cell word-types-table__cell--meta" role="cell" [attr.data-label]="headers.type">{{ row.typeLabel.ar }}</span>
          <span class="word-types-table__cell word-types-table__cell--meta" role="cell" [attr.data-label]="headers.root">{{ row.rootText || placeholder }}</span>
          <span class="word-types-table__cell word-types-table__cell--meta" role="cell" [attr.data-label]="headers.stem">{{ row.stemText || placeholder }}</span>
          <span class="word-types-table__cell word-types-table__cell--meta" role="cell" [attr.data-label]="headers.lemma">{{ row.lemmaText || placeholder }}</span>
          <span class="word-types-table__cell word-types-table__cell--count" role="cell" [attr.data-label]="headers.occurrences">
            <qd-word-count-chip
              [label]="headers.occurrences"
              [count]="row.occurrencesCount"
              [showLabel]="false"
              (chipClick)="openCount(row, 'occurrences')"
            />
          </span>
          <span class="word-types-table__cell word-types-table__cell--count" role="cell" [attr.data-label]="headers.ayahs">
            <qd-word-count-chip
              [label]="headers.ayahs"
              [count]="row.ayahsCount"
              [showLabel]="false"
              (chipClick)="openCount(row, 'ayahs')"
            />
          </span>
          <span class="word-types-table__cell word-types-table__cell--count" role="cell" [attr.data-label]="headers.surahs">
            <qd-word-count-chip
              [label]="headers.surahs"
              [count]="row.surahsCount"
              [showLabel]="false"
              (chipClick)="openCount(row, 'surahs')"
            />
          </span>
        </button>
      }
    </div>
  } @else {
    <p class="word-types-table__placeholder">{{ tableLabel }}</p>
  }
</section>
