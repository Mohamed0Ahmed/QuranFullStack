<nav class="unique-words-tabs" role="tablist" aria-label="أنماط الكلمات الفريدة">
  @for (tab of tabs; track tab.key) {
    <a
      class="qd-interactive-surface unique-words-tabs__tab"
      role="tab"
      [attr.aria-selected]="activeMode() === tab.key"
      [routerLink]="tab.route"
      routerLinkActive="qd-is-selected"
      [attr.data-testid]="'unique-words-tab--' + tab.key"
    >
      {{ tab.labelAr }}
    </a>
  }
</nav>
