@if (isActive()) {
  <a
    class="qd-card word-section-card qd-interactive-surface"
    [class]="cardClass()"
    [routerLink]="route()"
    [attr.data-testid]="'word-section-card'"
  >
    <div class="word-section-card__body">
      <h2 class="qd-card-title">{{ labelAr() }}</h2>
      <p class="qd-text-muted">{{ descriptionAr() }}</p>
    </div>
  </a>
} @else {
  <div
    class="qd-card qd-card--quiet word-section-card"
    [attr.data-testid]="'word-section-card'"
    role="group"
    aria-disabled="true"
  >
    <div class="word-section-card__body">
      <div class="word-section-card__heading">
        <h2 class="qd-card-title word-section-card__title--disabled">{{ labelAr() }}</h2>
        <span class="qd-badge" data-testid="word-section-coming-soon">{{ comingSoonLabel() }}</span>
      </div>
      <p class="qd-text-muted">{{ descriptionAr() }}</p>
    </div>
  </div>
}
