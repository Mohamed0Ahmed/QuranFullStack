<div class="unique-words-table" role="table" aria-label="جدول الكلمات الفريدة">
  <div class="unique-words-table__header" role="rowgroup">
    <div class="unique-words-table__header-row" role="row">
      <div class="unique-words-table__header-cell" role="columnheader">الكلمة</div>
      <div class="unique-words-table__header-cell" role="columnheader">المواضع</div>
      <div class="unique-words-table__header-cell" role="columnheader">الآيات</div>
      <div class="unique-words-table__header-cell" role="columnheader">السور</div>
      <div class="unique-words-table__header-cell" role="columnheader">لم يذكر في</div>
    </div>
  </div>

  @if (useVirtualScroll()) {
    <cdk-virtual-scroll-viewport
      class="unique-words-table__body"
      [itemSize]="rowHeight"
      [minBufferPx]="rowHeight * 4"
      [maxBufferPx]="rowHeight * 8"
      role="rowgroup"
      aria-label="قائمة الكلمات الفريدة"
      (scrolledIndexChange)="onScrolledIndexChange($event)"
    >
      @for (row of rows(); track row.id) {
        <div
          class="unique-words-table__row"
          role="row"
          [class.qd-is-selected]="isSelected(row)"
          [attr.aria-selected]="isSelected(row)"
        >
          <div class="unique-words-table__cell unique-words-table__word-cell" role="cell">
            <button
              type="button"
              class="unique-words-table__word qd-interactive-surface"
              data-testid="unique-words-table-word-button"
              (click)="selectRow(row)"
            >
              <span class="unique-words-table__display">{{ row.displayText }}</span>
              <span class="qd-text-muted unique-words-table__location">
                {{ row.firstVerseKey }} · {{ row.firstLocation }}
              </span>
            </button>
          </div>

          <div class="unique-words-table__cell unique-words-table__chip-cell" role="cell">
            <qd-word-count-chip [label]="occurrencesLabel" [count]="row.occurrencesCount" [disabled]="true" />
          </div>
          <div class="unique-words-table__cell unique-words-table__chip-cell" role="cell">
            <qd-word-count-chip
              [label]="ayahsLabel"
              [count]="row.ayahsCount"
              [disabled]="row.ayahsCount === 0"
              (chipClick)="openDrilldown(row, 'ayahs')"
            />
          </div>
          <div class="unique-words-table__cell unique-words-table__chip-cell" role="cell">
            <qd-word-count-chip
              [label]="surahsLabel"
              [count]="row.surahsCount"
              [disabled]="row.surahsCount === 0"
              (chipClick)="openDrilldown(row, 'surahs')"
            />
          </div>
          <div class="unique-words-table__cell unique-words-table__chip-cell" role="cell">
            <qd-word-count-chip
              [label]="missingLabel"
              [count]="row.missingSurahsCount"
              (chipClick)="openDrilldown(row, 'missing')"
            />
          </div>
        </div>
      }
    </cdk-virtual-scroll-viewport>
  } @else {
    <div class="unique-words-table__body" role="rowgroup" aria-label="قائمة الكلمات الفريدة">
      @for (row of rows(); track row.id) {
        <div
          class="unique-words-table__row"
          role="row"
          [class.qd-is-selected]="isSelected(row)"
          [attr.aria-selected]="isSelected(row)"
        >
          <div class="unique-words-table__cell unique-words-table__word-cell" role="cell">
            <button
              type="button"
              class="unique-words-table__word qd-interactive-surface"
              data-testid="unique-words-table-word-button"
              (click)="selectRow(row)"
            >
              <span class="unique-words-table__display">{{ row.displayText }}</span>
              <span class="qd-text-muted unique-words-table__location">
                {{ row.firstVerseKey }} · {{ row.firstLocation }}
              </span>
            </button>
          </div>

          <div class="unique-words-table__cell unique-words-table__chip-cell" role="cell">
            <qd-word-count-chip [label]="occurrencesLabel" [count]="row.occurrencesCount" [disabled]="true" />
          </div>
          <div class="unique-words-table__cell unique-words-table__chip-cell" role="cell">
            <qd-word-count-chip
              [label]="ayahsLabel"
              [count]="row.ayahsCount"
              [disabled]="row.ayahsCount === 0"
              (chipClick)="openDrilldown(row, 'ayahs')"
            />
          </div>
          <div class="unique-words-table__cell unique-words-table__chip-cell" role="cell">
            <qd-word-count-chip
              [label]="surahsLabel"
              [count]="row.surahsCount"
              [disabled]="row.surahsCount === 0"
              (chipClick)="openDrilldown(row, 'surahs')"
            />
          </div>
          <div class="unique-words-table__cell unique-words-table__chip-cell" role="cell">
            <qd-word-count-chip
              [label]="missingLabel"
              [count]="row.missingSurahsCount"
              (chipClick)="openDrilldown(row, 'missing')"
            />
          </div>
        </div>
      }
    </div>
  }
</div>

@if (loadingMore()) {
  <div class="qd-loading-state unique-words-table__loading-more" aria-live="polite">
    {{ loadingLabel }}
  </div>
}
