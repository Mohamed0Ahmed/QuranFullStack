@if (showPagination()) {
  <nav class="unique-words-list-pagination" aria-label="تصفّح الكلمات">
    <button
      type="button"
      class="qd-btn qd-btn-secondary"
      data-testid="unique-words-pagination-prev"
      [disabled]="disabled() || currentPage() <= 1"
      (click)="pageChange.emit(currentPage() - 1)"
    >
      السابق
    </button>
    <span data-testid="unique-words-pagination-label">{{ currentPage() }} / {{ lastPage() }}</span>
    <button
      type="button"
      class="qd-btn qd-btn-secondary"
      data-testid="unique-words-pagination-next"
      [disabled]="disabled() || currentPage() >= lastPage()"
      (click)="pageChange.emit(currentPage() + 1)"
    >
      التالي
    </button>
  </nav>
}
