<qd-dashboard-hero
  [content]="hero"
  [mushafTarget]="mushafTarget"
  (workflowSelect)="scrollToSection('mushaf')"
/>

<qd-dashboard-resume-strip [items]="resumeItems" />

<qd-dashboard-workflow-rail
  [steps]="workflowSteps"
  [activeStep]="activeSection()"
  (sectionSelect)="scrollToSection($event)"
/>

<qd-dashboard-mushaf-preview
  id="mushaf"
  class="dashboard-section-motion"
  [qdDashboardSectionObserver]="'mushaf'"
  [content]="mushafContent"
  [mushafTarget]="mushafTarget"
  (sectionActive)="onSectionActive($event)"
/>

<qd-dashboard-word-structure
  id="words"
  class="dashboard-section-motion dashboard-section-motion--from-inline-start"
  [qdDashboardSectionObserver]="'words'"
  [content]="wordContent"
  (sectionActive)="onSectionActive($event)"
/>

<qd-dashboard-phrase-preview
  id="phrases"
  class="dashboard-section-motion dashboard-section-motion--from-inline-end"
  [qdDashboardSectionObserver]="'phrases'"
  [content]="phraseContent"
  (sectionActive)="onSectionActive($event)"
/>

<qd-dashboard-linking-flow
  id="linking"
  class="dashboard-section-motion"
  [qdDashboardSectionObserver]="'linking'"
  [content]="linkingContent"
  [mushafTarget]="mushafTarget"
  (sectionActive)="onSectionActive($event)"
/>

<qd-dashboard-abwab-preview
  id="abwab"
  class="dashboard-section-motion dashboard-section-motion--from-inline-start"
  [qdDashboardSectionObserver]="'abwab'"
  [content]="abwabContent"
  [active]="activeSection() === 'abwab'"
  (sectionActive)="onSectionActive($event)"
/>

<qd-dashboard-entry-section
  id="entry"
  class="dashboard-section-motion dashboard-section-motion--from-inline-end"
  [qdDashboardSectionObserver]="'entry'"
  [heading]="entryHeading"
  [items]="entryItems"
  (sectionActive)="onSectionActive($event)"
/>
