@if (actions().length > 0) {
  <section
    class="qd-surface qd-surface--quiet access-lifecycle-actions"
    data-testid="access-account-actions"
    aria-labelledby="access-account-actions-title"
  >
    <h3 id="access-account-actions-title" class="qd-card-title">إجراءات الحساب</h3>
    @if (actions().includes('disable')) {
      <p class="qd-text-muted" data-testid="access-disable-cost">
        يوقف التعطيل وصول الحساب ويزيل جميع صلاحياته المباشرة نهائيًا.
      </p>
    }
    <div class="access-lifecycle-actions__actions">
      @if (actions().includes('accept')) {
        <button
          type="button"
          qdAction="primary"
          data-testid="access-request-accept"
          [busy]="busyAction() === 'accept'"
          [disabled]="busyAction() !== null"
          (click)="requestAction('accept')"
        >
          @if (acceptGrantsPermissions()) {
            قبول وتفعيل مع الصلاحيات المحددة
          } @else {
            قبول وتفعيل دون صلاحيات
          }
        </button>
      }
      @if (actions().includes('disable')) {
        <button
          type="button"
          qdAction="secondary"
          data-testid="access-request-disable"
          [busy]="busyAction() === 'disable'"
          [disabled]="busyAction() !== null"
          (click)="requestAction('disable')"
        >
          تعطيل الحساب
        </button>
      }
      @if (actions().includes('reactivate')) {
        <button
          type="button"
          qdAction="primary"
          data-testid="access-request-reactivate"
          [busy]="busyAction() === 'reactivate'"
          [disabled]="busyAction() !== null"
          (click)="requestAction('reactivate')"
        >
          إعادة التفعيل
        </button>
      }
    </div>
  </section>
}
