<section class="access-permission-editor" aria-label="الصلاحيات المباشرة">
  @for (group of groups(); track group.key) {
    <fieldset class="access-permission-editor__group">
      <legend class="access-permission-editor__legend">{{ group.label }}</legend>
      <label class="qd-check-row access-permission-editor__select-all">
        <input
          class="qd-checkbox"
          type="checkbox"
          [attr.data-testid]="'access-permission-group-' + group.key"
          [checked]="isGroupSelected(group)"
          [indeterminate]="isGroupPartiallySelected(group)"
          [disabled]="disabled()"
          (change)="changeGroup(group, $event)"
        />
        <span>تحديد الكل</span>
      </label>

      <div class="access-permission-editor__codes">
        @for (code of group.codes; track code) {
          <label class="qd-check-row access-permission-editor__code" [title]="code">
            <input
              class="qd-checkbox"
              type="checkbox"
              [attr.data-testid]="'access-permission-' + code"
              [checked]="isCodeSelected(code)"
              [disabled]="disabled()"
              (change)="changeCode(code, $event)"
            />
            <span>{{ labelFor(group, code) }}</span>
          </label>
        }
      </div>
    </fieldset>
  }
</section>
