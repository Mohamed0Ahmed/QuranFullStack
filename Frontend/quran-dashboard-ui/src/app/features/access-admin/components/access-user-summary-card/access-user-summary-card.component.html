@if (user(); as target) {
  <span
    class="qd-ltr-isolate qd-text-meta"
    data-testid="access-user-summary-email"
    dir="ltr"
  >{{ target.email }}</span>
  <span class="qd-flex qd-items-center qd-gap-2" data-testid="access-user-summary-badges">
    @if (target.isOwner) {
      <span
        class="qd-badge qd-badge--status qd-badge--membership-owner"
        data-testid="access-user-summary-membership"
      >مالك</span>
    }
    <span
      [class]="lifecycleBadgeClass(target)"
      data-testid="access-user-summary-lifecycle"
    >{{ statusLabel(target) }}</span>
  </span>
}
