@if (user(); as target) {
  <h2
    id="access-admin-workspace-title"
    class="explorer-panel-header__label qd-truncate"
    data-testid="access-user-summary-name"
    [title]="nameLabel(target)"
  >{{ nameLabel(target) }}</h2>
  <span class="explorer-panel-header__entity" dir="ltr" [title]="target.email">{{ target.email }}</span>
  <span class="explorer-panel-header__end qd-gap-2" data-testid="access-user-summary-badges">
    @if (target.isOwner) {
      <span class="qd-badge qd-badge--accent">مالك</span>
    }
    <span class="qd-badge">{{ statusLabel(target) }}</span>
  </span>
} @else {
  <h2 id="access-admin-workspace-title" class="explorer-panel-header__label">مساحة عمل الحساب</h2>
}
