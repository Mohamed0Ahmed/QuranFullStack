<article
  qdResultItem
  [selectable]="true"
  [selected]="row().checked"
  [position]="position()"
  [setSize]="setSize()"
  class="linking-workspace-source-row"
  (click)="toggleMembershipFromRow($event)"
>
  <label class="linking-workspace-source-row__membership">
    <input
      class="qd-checkbox"
      type="checkbox"
      [checked]="row().checked"
      [attr.aria-label]="membershipLabel()"
      (change)="membershipChanged.emit(!row().checked)"
    />
  </label>

  <div class="linking-workspace-source-row__identity">
    <p>{{ sourceKind() }}</p>
    <h3>{{ row().item.source.label }}</h3>
  </div>

  <div class="linking-workspace-source-row__count">
    <button
      qdAction="secondary"
      size="sm"
      type="button"
      class="linking-workspace-source-row__ayahs-button"
      [attr.data-linking-editor-source-key]="row().item.sourceKey"
      [attr.aria-label]="showAyahsLabel()"
      (click)="editRequested.emit()"
    >
      <span class="linking-workspace-source-row__wide-label">{{ labels.showAyahs }}</span>
      <span class="linking-workspace-source-row__compact-label" aria-hidden="true">
        {{ labels.showAyahsCompact }}
      </span>
      <span class="linking-workspace-source-row__ayahs-count">{{ row().countLabel }}</span>
    </button>
  </div>

  @if (automaticConfiguration(); as configuration) {
    <div class="linking-workspace-source-row__toggles">
      <button
        qdAction="secondary"
        size="sm"
        type="button"
        class="linking-workspace-source-row__toggle"
        [class.linking-workspace-source-row__toggle--active]="configuration.automaticWordMatchesEnabled"
        [attr.aria-pressed]="configuration.automaticWordMatchesEnabled"
        [attr.aria-label]="automaticWordsLabel()"
        (click)="automaticWordsChanged.emit(!configuration.automaticWordMatchesEnabled)"
      >
        <span class="linking-workspace-source-row__toggle-mark" aria-hidden="true">
          {{ configuration.automaticWordMatchesEnabled ? '✓' : '' }}
        </span>
        <span class="linking-workspace-source-row__wide-label">{{ labels.highlightStep }}</span>
        <span class="linking-workspace-source-row__compact-label" aria-hidden="true">
          {{ labels.highlightStepCompact }}
        </span>
      </button>
    </div>
  }

  <button
    qdAction="danger"
    size="sm"
    type="button"
    class="linking-workspace-source-row__remove"
    [attr.aria-label]="labels.removeSource + ': ' + row().item.source.label"
    (click)="removeRequested.emit()"
  >
    <span aria-hidden="true">×</span>
  </button>
</article>
