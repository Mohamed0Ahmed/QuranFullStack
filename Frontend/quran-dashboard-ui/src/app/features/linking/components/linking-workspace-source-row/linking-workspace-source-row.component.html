<article
  qdResultItem
  [selectable]="true"
  [selected]="row().checked"
  [position]="position()"
  [setSize]="setSize()"
  class="linking-workspace-source-row"
>
  <div class="linking-workspace-source-row__identity">
    <p>{{ sourceKind() }}</p>
    <h3>{{ row().item.source.label }}</h3>
  </div>
  <div class="linking-workspace-source-row__count">
    <span>{{ labels.resolvedResultCount }}</span>
    <button qdAction="tertiary" size="sm" type="button" [attr.data-linking-editor-source-key]="row().item.sourceKey" (click)="editRequested.emit()">
      {{ row().countLabel }}
    </button>
  </div>
  @if (automaticConfiguration(); as configuration) {
    <label class="qd-check-row linking-workspace-source-row__words">
      <input class="qd-checkbox" type="checkbox" [checked]="configuration.automaticWordMatchesEnabled" (change)="automaticWordsChanged.emit($any($event.target).checked)" />
      <span>{{ labels.highlightStep }}</span>
    </label>
  } @else {
    <button qdAction="tertiary" size="sm" type="button" (click)="manualWordsRequested.emit()">{{ labels.manualWords }}</button>
  }
  <button qdAction="danger" size="sm" type="button" (click)="removeRequested.emit()">{{ labels.removeSource }}</button>
  <label class="qd-check-row linking-workspace-source-row__membership">
    <input class="qd-checkbox" type="checkbox" [checked]="row().checked" (change)="membershipChanged.emit($any($event.target).checked)" />
    <span>{{ labels.selectForOperation }}</span>
  </label>
</article>
