<section class="linking-source-ayah-editor" aria-label="تعديل اختيار آيات المصدر">
  <header class="linking-source-ayah-editor__header">
    <div>
      @if (state().sourceLabel; as sourceLabel) {
        <p class="linking-source-ayah-editor__source">{{ sourceLabel }}</p>
      }
      <p class="linking-source-ayah-editor__ready-count">
        {{ labels.sourceEditorReady }}: {{ selectedCount() }}
      </p>
    </div>
    <button
      qdAction="secondary"
      size="sm"
      type="button"
      [busy]="dismissPending()"
      [disabled]="dismissPending()"
      (click)="dismiss()"
    >
      {{ labels.sourceEditorBack }}
    </button>
  </header>

  @if (currentItem(); as item) {
    <div class="linking-source-ayah-editor__toolbar">
      @if (item.configuration.kind === 'manual') {
        <qd-linking-manual-shape-selector
          [selectedCount]="selectedCount()"
          [linkShape]="item.configuration.linkShape"
          (linkShapeChanged)="setManualLinkShape($event)"
        />
      } @else if (automaticConfiguration(); as configuration) {
        <button
          qdAction="secondary"
          size="sm"
          type="button"
          [class.qd-is-selected]="configuration.automaticWordMatchesEnabled"
          [attr.aria-pressed]="configuration.automaticWordMatchesEnabled"
          (click)="facade.setAutomaticWordMatches(!configuration.automaticWordMatchesEnabled)"
        >
          {{ labels.highlightStep }}
        </button>
      }
      <button qdAction="secondary" size="sm" type="button" (click)="facade.selectAll()">
        {{ labels.selectAll }}
      </button>
      <button qdAction="secondary" size="sm" type="button" (click)="facade.clearAll()">
        {{ labels.clearAll }}
      </button>
    </div>
    @if (request(); as pageRequest) {
      <qd-linking-virtual-ayah-list
        [scope]="'workspace-editor:' + item.sourceKey"
        [sourceRequest]="pageRequest"
        [selectedAyahIds]="item.ayahOverrideIds"
        [selectionMode]="item.configuration.ayahInclusion.mode"
        [selectedWordIdsByAyahId]="item.selectedWordIdsByAyahId"
        [selectionEnabled]="true"
        [wordSelectable]="item.configuration.kind === 'manual'"
        [highlightSourceWords]="item.configuration.kind === 'automatic' ? item.configuration.automaticWordMatchesEnabled : true"
        [grouped]="item.configuration.kind === 'manual' && item.configuration.linkShape === 'grouped' && selectedCount() > 1"
        [listLabel]="labels.sourceEditorAyahList"
        (ayahToggled)="facade.toggleAyah($event)"
        (wordToggled)="toggleWord($event)"
        (pageReady)="facade.pageReady($event.linkingDataRevision, $event.totalItems)"
      />
    }
  }
</section>
