<section class="linking-ayah-selection" aria-label="اختيار الآيات">
  <header class="linking-ayah-selection__header">
    <p>{{ labels.selectedCount }}: {{ selectedCount() }}</p>
    <div class="linking-ayah-selection__bulk-actions">
      <button qdAction="tertiary" size="sm" type="button" [disabled]="disabled()" (click)="selectAllRequested.emit()">
        {{ labels.selectAll }}
      </button>
      <button qdAction="tertiary" size="sm" type="button" [disabled]="disabled()" (click)="clearAllRequested.emit()">
        {{ labels.clearAll }}
      </button>
    </div>
  </header>

  <qd-form-field [label]="labels.searchAyahs">
    <input
      #searchInput
      qdControl
      type="search"
      [value]="query()"
      [disabled]="disabled()"
      (input)="onSearch($event)"
    />
  </qd-form-field>

  @if (ayahs().length > 0) {
    <cdk-virtual-scroll-viewport
      class="linking-ayah-selection__viewport"
      role="group"
      [attr.aria-label]="listLabel()"
    >
      <div *cdkVirtualFor="let ayah of ayahs(); trackBy: trackAyah" class="linking-ayah-selection__row">
        <input
          class="qd-checkbox"
          type="checkbox"
          [id]="inputId(ayah.verseKey)"
          [checked]="isSelected(ayah.verseKey)"
          [disabled]="disabled()"
          (change)="selectionToggled.emit(ayah.verseKey)"
        />
        <label class="linking-ayah-selection__activation" [for]="inputId(ayah.verseKey)">
          {{ labels.selectAyahs }}: {{ ayah.verseKey }}
        </label>
        <qd-linking-ayah-card [ayah]="ayah" [highlightSourceWords]="highlightSourceWords()" />
        @if (ayahExtraTemplate(); as extraTemplate) {
          <ng-container *ngTemplateOutlet="extraTemplate; context: { $implicit: ayah }" />
        }
      </div>
    </cdk-virtual-scroll-viewport>
  } @else {
    <p class="linking-ayah-selection__empty" role="status">{{ labels.noAyahMatches }}</p>
  }
</section>
