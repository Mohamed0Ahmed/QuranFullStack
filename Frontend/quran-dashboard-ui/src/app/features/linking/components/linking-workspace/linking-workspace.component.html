<qd-details-workspace [identity]="labels.preparedSources" variant="action-rail" testIdPrefix="linking-workspace-content">
  <div qdDetailsActions class="linking-workspace__top-actions">
    <span>{{ labels.selectedSourcesCount }}: {{ selectedCount() }}</span>
    <button qdAction="primary" size="sm" type="button" [disabled]="selectedCount() === 0" (click)="linkSelected()">{{ labels.linkSelected }}</button>
    @if (selectedCount() > 0) { <button qdAction="tertiary" size="sm" type="button" (click)="clearSelection()">{{ labels.clearSelection }}</button> }
    <button qdAction="danger" size="sm" type="button" [disabled]="!hasRows()" (click)="removeAll()">{{ labels.removeAll }}</button>
  </div>
  <div qdDetailsStatus>
    @if (removedItem(); as removed) { <span>{{ labels.sourceRemoved }}</span><button qdAction="tertiary" size="sm" type="button" (click)="undo()">{{ labels.undo }}</button> }
  </div>
  @if (hasRows()) {
    <div qdResultList listVariant="linked" [listLabel]="labels.preparedSources" class="linking-workspace__items">
      @for (row of rows(); track row.item.sourceKey; let index = $index) {
        <qd-linking-workspace-source-row
          [row]="row" [position]="index + 1" [setSize]="rows().length"
          (membershipChanged)="toggleMembership(row.item.sourceKey, $event)"
          (editRequested)="edit(row.item.sourceKey)"
          (automaticWordsChanged)="automaticWords(row.item.sourceKey, $event)"
          (removeRequested)="remove(row.item.sourceKey)"
        />
      }
    </div>
  } @else { <qd-empty-state [message]="labels.emptyWorkspace" /> }
</qd-details-workspace>
