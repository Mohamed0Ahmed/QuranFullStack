<article
  qdAyahCard
  class="linking-ayah-card"
  [attr.aria-label]="'سورة ' + ayah().surahNameArabic + '، الآية ' + ayah().ayahNumber"
>
  <header class="linking-ayah-card__meta">
    <span>{{ ayah().surahNameArabic }}</span>
    <span aria-hidden="true">—</span>
    <span>الآية {{ ayah().ayahNumber }}</span>
  </header>
  <p class="linking-ayah-card__text" dir="rtl">
    @for (word of displayWords(); track word.renderPosition) {
      <span
        class="linking-ayah-card__word"
        [class.linking-ayah-card__word--selected]="word.highlight === 'selected'"
        [class.linking-ayah-card__word--added]="word.highlight === 'added'"
        [class.linking-ayah-card__word--existing]="word.highlight === 'existing'"
        [class.linking-ayah-card__word--removed]="word.highlight === 'removed'"
      >{{ word.textUthmani }}</span>
    }
  </p>
  @if (sourceLabels().length > 0) {
    <p class="linking-ayah-card__provenance">
      <span>{{ labels.ayahSources }}:</span>
      @for (label of sourceLabels(); track $index) {
        <span class="linking-ayah-card__provenance-name">{{ label }}</span>
      }
    </p>
  }
</article>
