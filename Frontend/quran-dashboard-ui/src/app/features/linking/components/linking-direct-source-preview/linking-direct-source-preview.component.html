<section class="linking-direct-source-preview" [attr.aria-label]="labels.directSourceAyahPreview">
  <p class="linking-direct-source-preview__count">
    <span>{{ labels.directSourceAyahCount }}</span>
    <strong>{{ ayahs().length }}</strong>
  </p>

  <cdk-virtual-scroll-viewport
    class="linking-direct-source-preview__viewport"
    role="list"
    [attr.aria-label]="labels.directSourceAyahPreview"
  >
    <div
      *cdkVirtualFor="let ayah of ayahs(); let index = index; trackBy: trackAyah"
      class="linking-direct-source-preview__ayah"
      role="listitem"
      [attr.aria-posinset]="index + 1"
      [attr.aria-setsize]="ayahs().length"
    >
      <qd-linking-ayah-card
        [ayah]="ayah"
        [highlightSourceWords]="highlightSourceWords()"
      />
    </div>
  </cdk-virtual-scroll-viewport>
</section>
