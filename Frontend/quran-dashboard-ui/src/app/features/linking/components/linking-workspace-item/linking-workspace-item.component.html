<article class="linking-workspace-item" role="listitem">
  <header class="linking-workspace-item__header">
    <p class="linking-workspace-item__kind">{{ sourceKindLabel() }}</p>
    <h3 class="linking-workspace-item__label">{{ item().source.label }}</h3>
  </header>

  <dl class="linking-workspace-item__metadata">
    <div class="linking-workspace-item__metadata-row">
      <dt>{{ labels.resultCount }}</dt>
      <dd>{{ resultCountText() }}</dd>
    </div>
    <div class="linking-workspace-item__metadata-row">
      <dt>{{ labels.selectedCount }}</dt>
      <dd>{{ selectedCountText() }}</dd>
    </div>
    <div class="linking-workspace-item__metadata-row">
      <dt>{{ labels.highlightSourceWords }}</dt>
      <dd>{{ highlightText() }}</dd>
    </div>
  </dl>

  <footer class="linking-workspace-item__actions">
    <button type="button" qdAction="secondary" size="sm" (click)="editSelectionRequested.emit(item())">
      {{ labels.editSelection }}
    </button>
    <button type="button" qdAction="primary" size="sm" (click)="directLinkRequested.emit(item())">
      {{ labels.directLink }}
    </button>
    <button type="button" qdAction="danger" size="sm" (click)="removeRequested.emit(item())">
      {{ labels.removeSource }}
    </button>
  </footer>
</article>
