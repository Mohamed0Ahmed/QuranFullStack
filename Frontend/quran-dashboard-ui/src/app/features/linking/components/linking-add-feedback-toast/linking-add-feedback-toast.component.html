<div class="linking-add-feedback-toast__live" role="status" aria-live="polite" aria-atomic="true">
  @if (feedback(); as current) {
    @for (item of [current]; track item.id) {
      <div
        class="linking-add-feedback-toast"
        [class.linking-add-feedback-toast--added]="item.status === 'added'"
        [class.linking-add-feedback-toast--existing]="item.status === 'already-present'"
        [attr.data-feedback-id]="item.id"
      >
        @if (item.status === 'added') {
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="m5 12 4 4 10-10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 8v5M12 17h.01M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        }
        <span>{{ item.message }}</span>
      </div>
    }
  }
</div>
