<section class="linking-virtual-ayah-list" [attr.aria-label]="listLabel()">
  @if (status() === 'error') {
    <div class="linking-virtual-ayah-list__error" role="alert">
      <p>{{ errorMessage() }}</p>
      <button qdAction="secondary" size="sm" type="button" (click)="retry()">{{ labels.retry }}</button>
    </div>
  }
  <cdk-virtual-scroll-viewport
    class="linking-virtual-ayah-list__viewport"
    role="list"
    [attr.aria-label]="listLabel()"
  >
    <div
      *cdkVirtualFor="let row of rows(); let index = index; trackBy: trackRow"
      class="linking-virtual-ayah-list__row"
      [class.linking-virtual-ayah-list__row--grouped]="isGroupedRow(row)"
      [class.linking-virtual-ayah-list__row--grouped-start]="isGroupedStart(index)"
      [class.linking-virtual-ayah-list__row--grouped-end]="isGroupedEnd(index)"
      role="listitem"
      [attr.aria-posinset]="index + 1"
      [attr.aria-setsize]="rows().length"
    >
      @if (displayGroupLabel(row); as label) {
        <p class="linking-virtual-ayah-list__group">{{ label }}</p>
      }
      @if (ayahFor(row); as ayah) {
        <div
          class="linking-virtual-ayah-list__content"
          [class.linking-virtual-ayah-list__content--with-selection]="selectionEnabled()"
          [class.linking-virtual-ayah-list__content--grouped]="isGroupedRow(row)"
        >
          @if (selectionEnabled()) {
            <input
              class="qd-checkbox"
              type="checkbox"
              [checked]="isSelected(row)"
              [disabled]="!row.linkingSourceAyah"
              [attr.aria-label]="row.linkingSourceAyah
                ? 'تحديد سورة ' + ayah.surahNameArabic + '، الآية ' + ayah.ayahNumber
                : 'نوع الكلمة غير محدد للربط في سورة ' + ayah.surahNameArabic + '، الآية ' + ayah.ayahNumber"
              (change)="toggleAyah(row)"
            />
          }
          <qd-linking-ayah-card
            [ayah]="ayah"
            [resultPosition]="row.position + 1"
            [resultCount]="rows().length"
            [showResultCount]="false"
            metaAlignment="center"
            [highlightSourceWords]="highlightSourceWords()"
            [wordSelectable]="wordSelectable() && row.linkingSourceAyah"
            [wordImpact]="overlayFor(row)?.doorWordImpact ?? null"
            [statusLabel]="statusLabel(row)"
            [grouped]="isGroupedRow(row)"
            (click)="toggleAyah(row)"
            (wordToggled)="wordToggled.emit({ ayahId: ayah.ayahId, quranWordId: $event })"
          />
        </div>
      } @else {
        <div class="linking-virtual-ayah-list__skeleton" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
      }
    </div>
  </cdk-virtual-scroll-viewport>
</section>
