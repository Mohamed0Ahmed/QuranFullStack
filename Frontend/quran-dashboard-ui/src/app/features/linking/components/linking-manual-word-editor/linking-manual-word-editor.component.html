<section class="linking-manual-word-editor" aria-label="تحديد كلمات الآيات">
  <header class="linking-manual-word-editor__header">
    <div>
      <p class="linking-manual-word-editor__summary">{{ labels.manualWordsSummary }}: {{ selectedWordCount() }}</p>
      <p class="linking-manual-word-editor__hint">{{ labels.manualWordsDraftHint }}</p>
    </div>
    <div class="linking-manual-word-editor__header-actions">
      <button qdAction="tertiary" size="sm" type="button" (click)="dismiss()">{{ labels.manualWordsBack }}</button>
      <button qdAction="primary" size="sm" type="button" (click)="save()">{{ labels.manualWordsSave }}</button>
    </div>
  </header>
  @if (item(); as workspaceItem) {
    @if (request(); as pageRequest) {
      <qd-linking-virtual-ayah-list
        [scope]="'manual-word-editor:' + workspaceItem.sourceKey"
        [sourceRequest]="pageRequest"
        [selectedWordIdsByAyahId]="state().draftWordIdsByAyahId"
        [wordSelectable]="true"
        [listLabel]="labels.manualWords"
        (wordToggled)="toggleWord($event)"
        (pageReady)="facade.pageReady($event.linkingDataRevision, $event.totalItems)"
      />
    }
  }
</section>
