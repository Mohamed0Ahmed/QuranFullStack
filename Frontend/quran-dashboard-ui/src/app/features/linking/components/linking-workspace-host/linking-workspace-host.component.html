@if (isOpen()) {
  <qd-modal-shell
    variant="wide"
    [wideInlineSize]="'var(--qd-linking-workspace-modal-inline-size)'"
    [wideBlockSize]="'var(--qd-linking-workspace-modal-block-size)'"
    [titleText]="modalTitle()"
    closeLabel="إغلاق"
    [closeAction]="isSourceAyahEditor() ? 'secondary' : 'tertiary'"
    [open]="isOpen()"
    [hasFooter]="false"
    [flushBody]="true"
    [compactHeader]="isWorkspace() || isLinkingFlow()"
    [returnFocus]="false"
    testIdPrefix="linking-workspace"
    (dismissed)="close()"
  >
    @if (persistenceWarning(); as warning) {
      <qd-error-state
        severity="write"
        [message]="warning"
        [actionLabel]="labels.workspaceSyncDismiss"
        (action)="dismissPersistenceWarning()"
      />
    }
    <div #surfaceEntry class="linking-workspace-host__surface-entry" tabindex="-1">
      @defer (on idle) {
        @if (isWorkspace()) {
          <qd-linking-workspace />
        } @else if (isSourceAyahEditor()) {
          <qd-linking-source-ayah-editor
            [sourceKey]="editorSourceKey()"
            [dismissPending]="editorExitPending()"
            (dismissed)="closeSourceEditor()"
          />
        } @else if (isLinkingFlow()) {
          <qd-direct-link-workflow />
        }
      } @placeholder {
        <p class="qd-sr-only" role="status">{{ labels.sourceLoading }}</p>
      }
    </div>
  </qd-modal-shell>
}
