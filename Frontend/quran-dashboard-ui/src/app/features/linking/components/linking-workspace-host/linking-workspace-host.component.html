@defer (when isOpen()) {
  <qd-modal-shell
    variant="wide"
    [titleText]="modalTitle()"
    closeLabel="إغلاق"
    [open]="isOpen()"
    [hasFooter]="false"
    [flushBody]="true"
    testIdPrefix="linking-workspace"
    (dismissed)="close()"
  >
    @if (isWorkspace()) {
      <qd-linking-workspace />
    } @else if (isDirectLink()) {
      <qd-direct-link-workflow [workspaceSourceKey]="activeSourceKey()" />
    }
  </qd-modal-shell>
}
