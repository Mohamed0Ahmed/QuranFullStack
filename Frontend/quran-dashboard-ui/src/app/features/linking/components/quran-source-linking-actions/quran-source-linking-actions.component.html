@if (canUseLinking()) {
  <div
    class="quran-source-linking-actions"
    [class.quran-source-linking-actions--centered]="alignment() === 'center'"
    role="group"
    aria-label="خيارات الربط"
  >
    <button qdAction="primary" size="sm" type="button" [attr.aria-label]="addActionLabel()" [attr.data-linking-source-action]="sourceKey()" (click)="addToWorkspace()">
      {{ labels.addToWorkspace }}
    </button>
    <button qdAction="warning" size="sm" type="button" [attr.aria-label]="directActionLabel()" [attr.data-linking-source-action]="sourceKey()" (click)="startDirectLink()">
      {{ labels.directLink }}
    </button>
  </div>
}
