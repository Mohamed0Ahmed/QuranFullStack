@if (canUseLinking()) {
  <div class="quran-source-linking-actions" role="group" aria-label="خيارات الربط">
    <button qdAction="secondary" size="sm" type="button" (click)="addToWorkspace()">
      {{ labels.addToWorkspace }}
    </button>
    <button qdAction="tertiary" size="sm" type="button" (click)="startDirectLink()">
      {{ labels.directLink }}
    </button>
    @if (feedback(); as message) {
      <span class="qd-sr-only" aria-live="polite" [id]="feedbackId()">{{ message }}</span>
    }
  </div>
}
