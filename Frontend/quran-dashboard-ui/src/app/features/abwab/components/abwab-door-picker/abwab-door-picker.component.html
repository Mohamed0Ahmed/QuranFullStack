<qd-abwab-search-controls
  [query]="searchQuery()"
  [matchCount]="searchMatchCount()"
  [hideUnrelatedRoots]="hideUnrelatedRoots()"
  [placeholder]="searchPlaceholder()"
  [helper]="labels.searchScopeHintTree"
  [testIdPrefix]="testIdPrefix()"
  (queryChanged)="searchQuery.set($event)"
  (hideUnrelatedRootsChanged)="hideUnrelatedRoots.set($event)"
/>

@if (doorsErrorMessage(); as error) {
  <qd-error-state
    class="abwab-door-picker__error"
    severity="read"
    [reserve]="true"
    [message]="error"
    [actionLabel]="retryLabel"
    testId="qd-state-error"
    actionTestId="qd-state-action"
    (action)="retry.emit()"
    [attr.data-testid]="testIdPrefix() + '-doors-error'"
  />
}

<div class="abwab-door-picker__surface" [attr.data-testid]="testIdPrefix() + '-tree'">
  @if (displayRoots().length > 0) {
    <qd-abwab-tree
      [roots]="displayRoots()"
      [ariaLabel]="labels.treeAriaLabel"
      orderScope="global"
      [selectedId]="selectedId()"
      [bulkMode]="!single()"
      [bulkSelectedIds]="pickedSet()"
      [disabledIds]="disabledSet()"
      [excludedIds]="excludedSet()"
      [disabledTag]="disabledTag()"
      [excludedTag]="excludedTag()"
      [expandSeedIds]="expandSeedIds()"
      [searchExpandedIds]="searchExpandedIds()"
      [matchedIds]="matchedIds()"
      [selectionMode]="true"
      [showActions]="false"
      [linksClickable]="false"
      [relationsClickable]="false"
      (selected)="toggle($event)"
      (bulkToggled)="toggle($event)"
      (expandedIdsChanged)="rememberExpanded($event)"
    />
  } @else if (status() === 'loading') {
    <qd-skeleton-rows
      [count]="6"
      rowTemplate="1.1rem 0.9375rem 1fr"
      [loadingLabel]="loadingLabel"
      [attr.data-testid]="testIdPrefix() + '-loading'"
    />
  } @else if (searchFoundNothing()) {
    <qd-empty-state [message]="noMatchesLabel" testId="qd-state-empty" [attr.data-testid]="testIdPrefix() + '-no-matches'" />
  } @else if (doorsErrorMessage() === '') {
    <qd-empty-state [message]="emptyMessage()" testId="qd-state-empty" [attr.data-testid]="testIdPrefix() + '-doors-empty'" />
  }
</div>
