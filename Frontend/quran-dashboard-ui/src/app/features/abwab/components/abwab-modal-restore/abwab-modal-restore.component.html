<button
  #restoreButton
  type="button"
  qdAction="icon-only"
  class="abwab-modal-restore__btn"
  data-testid="abwab-page-modal-restore"
  [attr.aria-label]="restoreLabel()"
  [title]="restoreLabel()"
  (click)="restore.emit()"
>
  <span aria-hidden="true">↶</span>
</button>
<button
  type="button"
  qdAction="icon-only"
  class="abwab-modal-restore__discard"
  data-testid="abwab-page-modal-discard"
  [attr.aria-label]="discardAriaLabel()"
  [title]="discardAriaLabel()"
  (click)="discard.emit()"
>
  ×
</button>
