<button
  #restoreButton
  type="button"
  qdAction="secondary"
  class="abwab-modal-restore__btn"
  data-testid="abwab-page-modal-restore"
  (click)="restore.emit()"
>
  {{ restoreLabel() }}
</button>
<button
  type="button"
  qdAction="icon-only"
  class="abwab-modal-restore__discard"
  data-testid="abwab-page-modal-discard"
  [attr.aria-label]="discardAriaLabel()"
  (click)="discard.emit()"
>
  ×
</button>
