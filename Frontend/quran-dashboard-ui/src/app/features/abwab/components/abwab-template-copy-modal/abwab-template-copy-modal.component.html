@if (open()) {
  <qd-modal-shell
    variant="wide"
    testIdPrefix="abwab-template-copy-modal"
    [open]="true"
    [titleText]="titleText()"
    [showClose]="false"
    [submitOnEnter]="true"
    (dismissed)="close()"
    (primaryActionRequested)="confirm()"
  >
    <p qdModalShellHeaderSupport class="abwab-template-copy-modal__desc">{{ descriptionText }}</p>

    <qd-error-state
      severity="write"
      [reserve]="true"
      [message]="errorMessage() ?? ''"
      testId="qd-state-error"
      data-testid="abwab-template-copy-modal-error"
    />

    <div class="abwab-template-copy-modal__preview" data-testid="abwab-template-copy-modal-preview">
      @if (hasElements()) {
        <p>{{ previewText() }}</p>
      } @else {
        <qd-empty-state [message]="emptyTemplateText" testId="qd-state-empty" data-testid="abwab-template-copy-modal-empty" />
      }
      <p>{{ previewNoRootText }}</p>
      <p>{{ previewDetachedText }}</p>
    </div>

    <div class="abwab-template-copy-modal__picker">
      <qd-abwab-door-picker
        [nodes]="liveRoots()"
        [pickedIds]="pickedIdList()"
        [status]="pickerStatus()"
        [errorMessage]="doorsError() ?? ''"
        [emptyMessage]="emptyDoorsLabel"
        [searchPlaceholder]="searchPlaceholder"
        testIdPrefix="abwab-template-copy-modal"
        (toggled)="togglePicked($event)"
        (retry)="retryDoors.emit()"
      />
      <p class="abwab-template-copy-modal__selected" data-testid="abwab-template-copy-modal-selected">
        {{ pickedIds().size === 0 ? noneSelectedLabel : selectedSummary() }}
      </p>
    </div>

    <div qdModalShellFooter class="abwab-template-copy-modal__foot">
      <button
        type="button"
        qdAction="primary"
        [disabled]="!canApply() || !hasElements() || pickedIds().size === 0 || applyBusy()"
        data-testid="abwab-template-copy-modal-confirm"
        (click)="confirm()"
      >
        {{ confirmLabel() }}
      </button>
      <button
        type="button"
        qdAction="tertiary"
        data-testid="abwab-template-copy-modal-cancel"
        (click)="close()"
      >
        {{ cancelLabel }}
      </button>
    </div>
  </qd-modal-shell>
}
