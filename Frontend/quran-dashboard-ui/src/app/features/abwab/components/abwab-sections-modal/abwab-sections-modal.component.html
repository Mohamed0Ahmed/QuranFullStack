@if (open()) {
  <div class="qd-modal-backdrop" data-testid="abwab-sections-modal-backdrop" (click)="requestClose()">
    <section
      class="qd-modal qd-modal--fixed abwab-sections-modal"
      role="dialog"
      aria-modal="true"
      dir="rtl"
      [attr.aria-labelledby]="titleId"
      qdModalScrollLock
      cdkTrapFocus
      cdkTrapFocusAutoCapture
      data-testid="abwab-sections-modal"
      (click)="$event.stopPropagation()"
      (keydown.escape)="requestClose()"
    >
      <header class="qd-modal__head">
        <h3 [id]="titleId">{{ title }}</h3>
      </header>

      <div class="qd-modal__body">
        @if (errorMessage(); as error) {
          <qd-state variant="error" [reserve]="true" [message]="error" data-testid="abwab-sections-modal-error" />
        }

        <ul class="abwab-sections-modal__list">
          @for (section of sections(); track section.id) {
            <li class="abwab-sections-modal__row" [attr.data-testid]="'abwab-sections-modal-row-' + section.id">
              @if (editingId() === section.id) {
                <input
                  type="text"
                  [value]="editingName()"
                  [attr.data-testid]="'abwab-sections-modal-rename-input-' + section.id"
                  (input)="onEditingNameInput($event)"
                />
                <button
                  type="button"
                  class="qd-btn qd-btn-primary"
                  [attr.data-testid]="'abwab-sections-modal-rename-save-' + section.id"
                  (click)="saveRename(section.id)"
                >
                  {{ saveLabel }}
                </button>
                <button type="button" class="qd-btn qd-btn-ghost" (click)="cancelRename()">{{ cancelLabel }}</button>
              } @else {
                <span class="abwab-sections-modal__name qd-truncate" [title]="section.name">{{ section.name }}</span>
                <button
                  type="button"
                  class="qd-btn qd-btn-ghost"
                  [attr.data-testid]="'abwab-sections-modal-rename-' + section.id"
                  (click)="startRename(section)"
                >
                  {{ renameLabel }}
                </button>
                <button
                  type="button"
                  class="qd-btn qd-btn-ghost"
                  [attr.data-testid]="'abwab-sections-modal-delete-' + section.id"
                  (click)="remove(section.id)"
                >
                  {{ deleteLabel }}
                </button>
              }
            </li>
          }
        </ul>

        <div class="abwab-sections-modal__add">
          <label for="abwab-sections-modal-name-input">{{ nameLabel }}</label>
          <input
            id="abwab-sections-modal-name-input"
            type="text"
            [value]="newSectionName()"
            data-testid="abwab-sections-modal-name-input"
            (input)="onNewNameInput($event)"
          />
          <button type="button" class="qd-btn qd-btn-primary" data-testid="abwab-sections-modal-add" (click)="add()">
            {{ addLabel }}
          </button>
        </div>
      </div>

      <footer class="qd-modal__foot">
        @if (confirmingDiscard()) {
          <div class="abwab-sections-modal__discard-confirm" role="alertdialog" data-testid="abwab-sections-modal-discard-confirm">
            <p>{{ dirtyCloseConfirmMessage }}</p>
            <div class="abwab-sections-modal__foot-actions">
              <button
                type="button"
                class="qd-btn"
                data-testid="abwab-sections-modal-discard-confirm-yes"
                (click)="confirmDiscard()"
              >
                {{ discardChangesLabel }}
              </button>
              <button
                type="button"
                class="qd-btn qd-btn-ghost"
                data-testid="abwab-sections-modal-discard-confirm-no"
                (click)="cancelDiscard()"
              >
                {{ keepEditingLabel }}
              </button>
            </div>
          </div>
        } @else {
          <div class="abwab-sections-modal__foot-actions">
            <button type="button" class="qd-btn qd-btn-ghost" data-testid="abwab-sections-modal-close" (click)="requestClose()">
              {{ closeLabel }}
            </button>
          </div>
        }
      </footer>
    </section>
  </div>
}
