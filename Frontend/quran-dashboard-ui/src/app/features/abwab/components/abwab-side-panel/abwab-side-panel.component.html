<div class="abwab-side-panel">
  <div class="qd-card abwab-side-panel__box">
    <h4>{{ activeDoorHeading }}</h4>
    @if (selectedDoor(); as door) {
      <div class="abwab-side-panel__active-door" data-testid="abwab-side-panel-active-door">
        <span class="abwab-side-panel__active-name">{{ door.name }}</span>
        <button
          type="button"
          class="abwab-side-panel__clear"
          data-testid="abwab-side-panel-clear"
          (click)="clearRequested.emit()"
        >
          {{ clearLabel }}
        </button>
      </div>
    } @else {
      <p class="abwab-side-panel__empty" data-testid="abwab-side-panel-empty">{{ noSelectionHint }}</p>
    }
  </div>

  <div class="qd-card abwab-side-panel__box">
    <h4>{{ operationsHeading }}</h4>
    <div class="abwab-side-panel__ops">
      <button
        type="button"
        class="abwab-side-panel__op"
        data-testid="abwab-side-panel-op-add-child"
        [disabled]="selectedDoor() === null"
        (click)="addChildRequested.emit()"
      >
        {{ addChildLabel }}
      </button>
      <button
        type="button"
        class="abwab-side-panel__op"
        data-testid="abwab-side-panel-op-edit"
        [disabled]="selectedDoor() === null"
        (click)="editRequested.emit()"
      >
        {{ editLabel }}
      </button>
      <button
        type="button"
        class="abwab-side-panel__op abwab-side-panel__op--danger"
        data-testid="abwab-side-panel-op-archive"
        [disabled]="selectedDoor() === null"
        (click)="archiveRequested.emit()"
      >
        {{ archiveLabel }}
      </button>
    </div>
  </div>
</div>
