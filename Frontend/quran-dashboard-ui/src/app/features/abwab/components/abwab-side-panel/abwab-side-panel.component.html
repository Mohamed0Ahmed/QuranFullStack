<div class="abwab-side-panel">
  <div class="qd-card abwab-side-panel__box">
    <h4>{{ activeDoorHeading }}</h4>
    @if (selectedDoor(); as door) {
      <div class="abwab-side-panel__active-door" data-testid="abwab-side-panel-active-door">
        <span class="abwab-side-panel__active-name qd-truncate" [title]="door.name">{{ door.name }}</span>
        <button
          type="button"
          class="abwab-side-panel__clear"
          data-testid="abwab-side-panel-clear"
          (click)="clearRequested.emit()"
        >
          {{ clearLabel }}
        </button>
      </div>
    } @else {
      <p class="abwab-side-panel__empty" data-testid="abwab-side-panel-empty">{{ noSelectionHint }}</p>
    }
  </div>

  <div class="qd-card abwab-side-panel__box">
    <h4>{{ operationsHeading }}</h4>
    <div class="abwab-side-panel__ops">
      <button
        type="button"
        class="abwab-side-panel__op abwab-side-panel__op--toggle"
        [class.abwab-side-panel__op--on]="bulkMode()"
        data-testid="abwab-side-panel-bulk-toggle"
        [disabled]="archiveViewActive()"
        (click)="toggleBulkMode()"
      >
        {{ bulkToggleLabel }}
      </button>

      <hr class="abwab-side-panel__sep" />

      <button
        type="button"
        class="abwab-side-panel__op"
        data-testid="abwab-side-panel-op-add-child"
        [disabled]="selectedDoor() === null || bulkMode()"
        (click)="addChildRequested.emit()"
      >
        {{ addChildLabel }}
      </button>
      <button
        type="button"
        class="abwab-side-panel__op"
        data-testid="abwab-side-panel-op-edit"
        [disabled]="selectedDoor() === null || bulkMode()"
        (click)="editRequested.emit()"
      >
        {{ editLabel }}
      </button>
      <button
        type="button"
        class="abwab-side-panel__op"
        data-testid="abwab-side-panel-op-move"
        [disabled]="selectedDoor() === null || bulkMode()"
        (click)="moveRequested.emit()"
      >
        {{ moveLabel }}
      </button>
      <button
        type="button"
        class="abwab-side-panel__op"
        data-testid="abwab-side-panel-op-relations"
        [disabled]="selectedDoor() === null || bulkMode()"
        (click)="relationsRequested.emit()"
      >
        {{ relationsLabel }}
      </button>
      <button
        type="button"
        class="abwab-side-panel__op abwab-side-panel__op--danger"
        data-testid="abwab-side-panel-op-archive"
        [disabled]="selectedDoor() === null || bulkMode()"
        (click)="archiveRequested.emit()"
      >
        {{ archiveLabel }}
      </button>
    </div>
  </div>

  @if (bulkMode()) {
    <div class="qd-card abwab-side-panel__bulk-bar" data-testid="abwab-side-panel-bulk-bar">
      <div>
        <span class="abwab-side-panel__bulk-count" data-testid="abwab-side-panel-bulk-count">{{ bulkCountText() }}</span>
      </div>
      <div class="abwab-side-panel__bulk-names" data-testid="abwab-side-panel-bulk-names">
        {{ bulkNames().join('، ') || '—' }}
      </div>
      <div class="abwab-side-panel__bulk-actions">
        <button type="button" class="abwab-side-panel__op" data-testid="abwab-side-panel-bulk-move" (click)="bulkMoveRequested.emit()">
          {{ bulkMoveAllLabel }}
        </button>
        <button
          type="button"
          class="abwab-side-panel__op"
          data-testid="abwab-side-panel-bulk-relations"
          (click)="bulkRelationsRequested.emit()"
        >
          {{ bulkRelationsLabel }}
        </button>
        <button
          type="button"
          class="abwab-side-panel__op abwab-side-panel__op--danger"
          data-testid="abwab-side-panel-bulk-archive"
          (click)="bulkArchiveRequested.emit()"
        >
          {{ bulkArchiveAllLabel }}
        </button>
        <button type="button" class="abwab-side-panel__op" data-testid="abwab-side-panel-bulk-clear" (click)="bulkClearRequested.emit()">
          {{ bulkClearLabel }}
        </button>
      </div>
    </div>
  }
</div>
