@if (open()) {
  <qd-modal-shell
    variant="wide"
    [wideInlineSize]="'var(--qd-abwab-workflow-modal-inline-size)'"
    [wideBlockSize]="'var(--qd-abwab-workflow-modal-block-size)'"
    testIdPrefix="abwab-move-picker"
    [open]="true"
    [titleText]="titleText()"
    [showClose]="false"
    [submitOnEnter]="true"
    [dismissOnBackdrop]="!busy()"
    [dismissOnEscape]="!busy()"
    (dismissed)="cancel()"
    (primaryActionRequested)="confirm()"
  >
    <p qdModalShellHeaderSupport class="abwab-move-picker__desc">{{ descriptionText }}</p>

    @if (errorMessage(); as message) {
      <qd-error-state severity="write" [message]="message" testId="abwab-move-picker-error" />
    }

    <qd-tabs
      qdModalShellHeaderSupport
      [ariaLabel]="sectionStripLabel"
      layout="grid"
      class="abwab-move-picker__strip"
    >
      @for (section of sections(); track section.id) {
        <button
          type="button"
          qdTab
          class="abwab-move-picker__section"
          [id]="sectionTabId(section.id)"
          [selected]="pickedSectionId() === section.id"
          [title]="section.name"
          [attr.aria-label]="section.name"
          [attr.aria-controls]="destinationsId"
          [attr.data-testid]="'abwab-move-picker-section-' + section.id"
          (click)="pickSection(section.id)"
        >
          <span class="abwab-move-picker__name qd-truncate">{{ section.name }}</span>
        </button>
      }
    </qd-tabs>

    @if (pickedSectionId() === null) {
      <p
        class="qd-empty-state"
        [id]="destinationsId"
        role="region"
        [attr.aria-label]="pickSectionHint"
        data-testid="abwab-move-picker-no-section"
      >
        {{ pickSectionHint }}
      </p>
    } @else {
      <div [id]="destinationsId" role="tabpanel" [attr.aria-labelledby]="sectionTabId(pickedSectionId()!)">
        <qd-abwab-search-controls
          class="abwab-move-picker__search"
          [query]="searchQuery()"
          [matchCount]="searchMatchCount()"
          [results]="searchMatches()"
          [hideUnrelatedRoots]="hideUnrelatedRoots()"
          [placeholder]="searchPlaceholder"
          [helper]="labels.searchScopeHintTree"
          testIdPrefix="abwab-move-picker"
          (queryChanged)="searchQuery.set($event)"
          (hideUnrelatedRootsChanged)="hideUnrelatedRoots.set($event)"
          (resultSelected)="pickParent($event)"
        />
        <div class="abwab-move-picker__destinations">
          <button
            type="button"
            qdAction="tertiary"
            class="abwab-move-picker__as-main"
            [class.qd-is-selected]="pickedParentId() === null"
            [attr.aria-pressed]="pickedParentId() === null"
            data-testid="abwab-move-picker-dest-asmain"
            (click)="pickAsMain()"
          >
            {{ asMainDoorLabel }}
          </button>

          @if (displayRoots().length > 0) {
            <div class="abwab-move-picker__tree qd-scroll-stable">
              <qd-abwab-tree
                [roots]="displayRoots()"
                [ariaLabel]="labels.treeAriaLabel"
                orderScope="global"
                [selectedId]="pickedParentId()"
                [expandSeedIds]="expandedIds()"
                [searchExpandedIds]="searchExpandedIds()"
                [matchedIds]="matchedIds()"
                [selectionMode]="true"
                [showActions]="false"
                [linksClickable]="false"
                [relationsClickable]="false"
                (selected)="pickParent($event)"
                (expandedIdsChanged)="rememberExpanded($event)"
              />
            </div>
          } @else if (searchFoundNothing()) {
            <qd-empty-state [message]="noMatchesLabel" testId="abwab-move-picker-no-matches" />
          } @else {
            <qd-empty-state [message]="emptyTreeLabel" testId="abwab-move-picker-empty" />
          }
        </div>
      </div>
    }

    <div qdModalShellFooter class="abwab-move-picker__foot">
      <button
        type="button"
        qdAction="primary"
        [busy]="busy()"
        [disabled]="pickedSectionId() === null || !canConfirm() || busy()"
        data-testid="abwab-move-picker-confirm"
        (click)="confirm()"
      >
        {{ confirmLabel }}
      </button>
      <button
        type="button"
        qdAction="tertiary"
        [disabled]="busy()"
        data-testid="abwab-move-picker-cancel"
        (click)="cancel()"
      >
        {{ cancelLabel }}
      </button>
    </div>
  </qd-modal-shell>
}
