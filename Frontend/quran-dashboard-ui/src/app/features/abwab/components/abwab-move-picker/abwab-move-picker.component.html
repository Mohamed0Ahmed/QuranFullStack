@if (open()) {
  <div class="qd-modal-backdrop" data-testid="abwab-move-picker-backdrop" (click)="cancel()">
    <section
      class="qd-modal abwab-move-picker"
      dir="rtl"
      qdModalScrollLock
      data-testid="abwab-move-picker"
      (click)="$event.stopPropagation()"
    >
      <h3>{{ titleText() }}</h3>
      <p class="abwab-move-picker__desc">{{ descriptionText }}</p>

      @if (stage() === 'section') {
        <div class="abwab-move-picker__list">
          <button
            type="button"
            class="abwab-move-picker__row"
            data-testid="abwab-move-picker-section-none"
            (click)="pickSection(null)"
          >
            {{ noSectionLabel }}
          </button>
          @for (section of sections(); track section.id) {
            <button
              type="button"
              class="abwab-move-picker__row"
              [attr.data-testid]="'abwab-move-picker-section-' + section.id"
              (click)="pickSection(section.id)"
            >
              {{ section.name }}
            </button>
          }
        </div>
      } @else {
        <div class="abwab-move-picker__list">
          <button
            type="button"
            class="abwab-move-picker__row"
            [class.abwab-move-picker__row--picked]="pickedParentId() === null"
            data-testid="abwab-move-picker-dest-asmain"
            (click)="pickAsMain()"
          >
            {{ asMainDoorLabel }}
          </button>
          @for (row of destinationRows(); track row.node.id) {
            <button
              type="button"
              class="abwab-move-picker__row"
              [class.abwab-move-picker__row--picked]="pickedParentId() === row.node.id"
              [style.--abwab-move-picker-depth]="row.depth"
              [attr.data-testid]="'abwab-move-picker-dest-' + row.node.id"
              (click)="pickParent(row.node.id)"
            >
              {{ row.node.name }}
            </button>
          }
        </div>
      }

      <div class="abwab-move-picker__foot">
        <button type="button" class="qd-btn qd-btn-primary" data-testid="abwab-move-picker-confirm" (click)="confirm()">
          {{ confirmLabel }}
        </button>
        <button type="button" class="qd-btn qd-btn-ghost" data-testid="abwab-move-picker-cancel" (click)="cancel()">
          {{ cancelLabel }}
        </button>
      </div>
    </section>
  </div>
}
