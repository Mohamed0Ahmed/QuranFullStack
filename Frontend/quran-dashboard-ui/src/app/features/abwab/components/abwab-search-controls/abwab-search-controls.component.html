<div class="abwab-search-controls">
  <qd-form-field
    class="abwab-search-controls__field"
    [label]="label()"
    [helper]="helper()"
  >
    <div class="abwab-search-controls__row">
      <input
        #searchInput
        cdkFocusInitial
        qdControl
        type="search"
        [placeholder]="placeholder()"
        [value]="searchDraft()"
        [attr.data-testid]="testIdPrefix() + '-search'"
        (input)="onSearchInput($event)"
      />

      <label
        class="qd-check-row abwab-search-controls__toggle"
        [class.abwab-search-controls__toggle--disabled]="toggleDisabled()"
      >
        <input
          type="checkbox"
          class="qd-checkbox"
          [checked]="hideUnrelatedRoots()"
          [disabled]="toggleDisabled()"
          [attr.data-testid]="testIdPrefix() + '-hide-unrelated'"
          (change)="onHideUnrelatedRootsChanged($event)"
        />
        <span>{{ hideUnrelatedLabel }}</span>
      </label>

      @if (query().trim() !== '') {
        <span
          class="abwab-search-controls__count"
          aria-hidden="true"
          [attr.data-testid]="testIdPrefix() + '-search-count'"
        >
          {{ matchCountText() }}
        </span>
      }
    </div>
  </qd-form-field>

  <ng-content select="[abwabSearchActions]" />

  @if (showResults()) {
    <ul
      class="abwab-search-controls__results"
      [attr.aria-label]="searchResultsAriaLabel"
      [attr.data-testid]="testIdPrefix() + '-search-results'"
    >
      @for (door of results(); track door.id) {
        <li class="abwab-search-controls__result-item">
          <button
            type="button"
            qdAction="secondary"
            size="sm"
            class="abwab-search-controls__result"
            [title]="door.name"
            [attr.aria-label]="resultAriaLabel(door.name)"
            [attr.data-testid]="testIdPrefix() + '-search-result-' + door.id"
            (click)="resultSelected.emit(door.id)"
          >
            <span class="abwab-search-controls__result-name">{{ door.name }}</span>
          </button>
        </li>
      }
    </ul>
  }

  <span
    class="qd-sr-only"
    role="status"
    [attr.data-testid]="testIdPrefix() + '-search-count-announce'"
  >
    {{ announcedCountText() }}
  </span>
</div>
