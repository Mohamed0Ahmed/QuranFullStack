@if (open()) {
  <qd-modal-shell
    variant="form"
    testIdPrefix="abwab-template-node-modal"
    [open]="true"
    [titleText]="modalTitle"
    [showClose]="false"
    [submitOnEnter]="true"
    (dismissed)="onDismissed($event)"
    (primaryActionRequested)="submit()"
  >
    <p
      qdModalShellHeaderSupport
      class="abwab-template-node-modal__context"
      data-testid="abwab-template-node-modal-context"
    >
      {{ contextText }}
    </p>

    <qd-abwab-door-fields-form
      [value]="initialFields"
      [errorMessage]="errorMessage()"
      testIdPrefix="abwab-template-node-modal"
    />

    <div qdModalShellFooter class="abwab-template-node-modal__foot-slot">
      @if (confirmingDiscard()) {
        <div
          class="abwab-template-node-modal__discard-confirm"
          role="alertdialog"
          data-testid="abwab-template-node-modal-discard-confirm"
        >
          <p>{{ dirtyCloseConfirmMessage }}</p>
          <div class="abwab-template-node-modal__actions">
            <button
              type="button"
              qdAction="secondary"
              data-testid="abwab-template-node-modal-discard-confirm-yes"
              (click)="confirmDiscard()"
            >
              {{ discardChangesLabel }}
            </button>
            <button
              type="button"
              qdAction="tertiary"
              data-testid="abwab-template-node-modal-discard-confirm-no"
              (click)="cancelDiscard()"
            >
              {{ keepEditingLabel }}
            </button>
          </div>
        </div>
      } @else {
        <div class="abwab-template-node-modal__actions">
          <button
            type="button"
            qdAction="primary"
            [disabled]="saveBusy() || !canSubmit()"
            data-testid="abwab-template-node-modal-save"
            (click)="submit()"
          >
            {{ saveLabel }}
          </button>
          <button
            type="button"
            qdAction="tertiary"
            data-testid="abwab-template-node-modal-cancel"
            (click)="requestClose()"
          >
            {{ cancelLabel }}
          </button>
        </div>
      }
    </div>
  </qd-modal-shell>
}
