<section class="abwab-door-link-copy" [attr.aria-label]="labels.doorLinksCopyHeading" (keydown.enter)="startFromEnter($event)">
  <header class="abwab-door-link-copy__header">
    <h5>{{ labels.doorLinksCopyHeading }}</h5>
    <button
      qdAction="icon-only"
      type="button"
      [disabled]="state().copy.status === 'running'"
      [attr.aria-label]="labels.doorLinksCopyClose"
      [title]="labels.doorLinksCopyClose"
      (click)="controller.close()"
    >
      <span aria-hidden="true">×</span>
      <span class="qd-sr-only">{{ labels.doorLinksCopyClose }}</span>
    </button>
  </header>

  @if (state().copy.status === 'choosing') {
    <div class="abwab-door-link-copy__target">
      <qd-abwab-management-picker
        [selectedDoorId]="state().copy.targetDoorId"
        [excludedDoorIds]="excludedIds()"
        (selectionChanged)="controller.selectTarget($event)"
      />
    </div>

    <div class="abwab-door-link-copy__actions">
      <button qdAction="primary" type="button" [disabled]="!canStart()" (click)="controller.start()">
        {{ labels.doorLinksCopyStart }}
      </button>
    </div>
  } @else if (state().copy.status === 'enumerating') {
    <qd-skeleton-rows [count]="2" rowTemplate="1fr auto" [loadingLabel]="labels.doorLinksCopyEnumerating" />
  } @else if (state().copy.status === 'preparing') {
    <qd-skeleton-rows [count]="2" rowTemplate="1fr auto" [loadingLabel]="labels.doorLinksCopyPreparing" />
  } @else if (state().copy.status === 'running') {
    <qd-notice
      [message]="labels.doorLinksCopyRunning"
      [dismissLabel]="null"
      testId="abwab-door-links-copy-running"
    />
  } @else if (state().copy.status === 'stopped') {
    <qd-error-state
      severity="write"
      [message]="state().copy.errorMessage ?? labels.doorLinksCopyStopped"
      [actionLabel]="labels.doorLinksCopyRetry"
      testId="abwab-door-links-copy-error"
      actionTestId="abwab-door-links-copy-retry"
      (action)="controller.retry()"
    />
  }
</section>
