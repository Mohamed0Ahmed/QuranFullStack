<div class="abwab-cards" data-testid="abwab-cards">
  <nav class="abwab-cards__crumbs" [attr.aria-label]="allDoorsCrumbLabel">
    <button
      type="button"
      qdAction="tertiary"
      size="sm"
      class="abwab-cards__crumb qd-truncate"
      [class.abwab-cards__crumb--current]="crumbs().length === 0"
      [title]="allDoorsCrumbLabel"
      data-testid="abwab-cards-crumb"
      (click)="onCrumbClick(null)"
    >
      {{ allDoorsCrumbLabel }}
    </button>
    @for (crumb of crumbs(); track crumb.id) {
      <span class="abwab-cards__crumb-sep" aria-hidden="true">›</span>
      <button
        type="button"
        qdAction="tertiary"
        size="sm"
        class="abwab-cards__crumb qd-truncate"
        [class.abwab-cards__crumb--current]="$last"
        [title]="nodePath(crumb.id, crumb.name)"
        data-testid="abwab-cards-crumb"
        (click)="onCrumbClick(crumb.id)"
      >
        {{ crumb.name }}
      </button>
    }
  </nav>

  @if (visibleLevel().length === 0) {
    <qd-empty-state [message]="emptyStateMessage()" testId="abwab-cards-empty" />
  } @else {
    <div class="abwab-cards__grid qd-grid qd-grid--doors">
      @for (node of visibleLevel(); track node.id) {
        <div class="abwab-cards__cell">
          <button
            type="button"
            class="abwab-cards__card"
            [class.abwab-cards__card--leaf]="node.children.length === 0"
            [class.abwab-cards__card--selected]="selectedId() === node.id"
            [class.abwab-cards__card--checked]="bulkSelectedIds().has(node.id)"
            [attr.aria-pressed]="selectedId() === node.id || bulkSelectedIds().has(node.id)"
            [attr.aria-label]="node.name"
            [attr.aria-description]="pathAriaDescription(node.id, node.name)"
            [attr.title]="nodePath(node.id, node.name)"
            [attr.data-testid]="'abwab-card-' + node.id"
            (click)="onCardClick(node)"
          >
            <span class="abwab-cards__title">
              <span class="abwab-cards__order">{{ displayOrder(node) }}</span>
              <span
                class="abwab-cards__name qd-truncate rounded-qd-sm px-qd-4"
                [class.bg-qd-warning-tint]="matchedIds().has(node.id)"
                [title]="nodePath(node.id, node.name)"
              >{{ node.name }}</span>
              @if (selectedId() === node.id || bulkSelectedIds().has(node.id)) {
                <span class="abwab-cards__state" aria-hidden="true">✓</span>
              } @else if (node.children.length > 0) {
                <span class="abwab-cards__drill" aria-hidden="true">‹</span>
              }
            </span>
            <span class="abwab-cards__meta">
              <span [attr.aria-label]="'الفروع المباشرة: ' + node.liveChildCount">
                <small aria-hidden="true">فروع</small><strong>{{ node.liveChildCount }}</strong>
              </span>
              <span [attr.aria-label]="'إجمالي الأبناء: ' + node.liveDescendantCount">
                <small aria-hidden="true">الكل</small><strong>{{ node.liveDescendantCount }}</strong>
              </span>
              <span [attr.aria-label]="'العمق: ' + node.maxRelativeDepth">
                <small aria-hidden="true">العمق</small><strong>{{ node.maxRelativeDepth }}</strong>
              </span>
              <span [attr.aria-label]="'الروابط: ' + node.linkCount">
                <small aria-hidden="true">روابط</small><strong>{{ node.linkCount }}</strong>
              </span>
              <span [attr.aria-label]="'المواضع: ' + node.selectedWordCount">
                <small aria-hidden="true">مواضع</small><strong>{{ node.selectedWordCount }}</strong>
              </span>
              <span [attr.aria-label]="'العلاقات: ' + node.relationCount">
                <small aria-hidden="true">علاقات</small><strong>{{ node.relationCount }}</strong>
              </span>
            </span>
          </button>
        </div>
      }
    </div>
  }
</div>
