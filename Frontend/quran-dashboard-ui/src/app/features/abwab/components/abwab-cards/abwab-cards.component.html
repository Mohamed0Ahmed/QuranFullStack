<div class="abwab-cards" data-testid="abwab-cards">
  <nav class="abwab-cards__crumbs" [attr.aria-label]="allDoorsCrumbLabel">
    <button
      type="button"
      class="abwab-cards__crumb"
      [class.abwab-cards__crumb--current]="crumbs().length === 0"
      data-testid="abwab-cards-crumb"
      (click)="onCrumbClick(null)"
    >
      {{ allDoorsCrumbLabel }}
    </button>
    @for (crumb of crumbs(); track crumb.id) {
      <span class="abwab-cards__crumb-sep" aria-hidden="true">‹</span>
      <button
        type="button"
        class="abwab-cards__crumb"
        [class.abwab-cards__crumb--current]="$last"
        data-testid="abwab-cards-crumb"
        (click)="onCrumbClick(crumb.id)"
      >
        {{ crumb.name }}
      </button>
    }
  </nav>

  <div class="abwab-cards__grid">
    @for (node of level(); track node.id) {
      <div
        class="abwab-cards__card"
        [class.abwab-cards__card--leaf]="node.children.length === 0"
        [class.abwab-cards__card--selected]="selectedId() === node.id"
        [class.abwab-cards__card--checked]="bulkSelectedIds().has(node.id)"
        [attr.data-testid]="'abwab-card-' + node.id"
        (click)="onCardClick(node)"
      >
        @if (bulkMode()) {
          <input
            type="checkbox"
            class="abwab-cards__checkbox"
            [checked]="bulkSelectedIds().has(node.id)"
            [attr.data-testid]="'abwab-card-checkbox-' + node.id"
            (click)="onCheckboxClick($event, node.id)"
          />
        }
        <div class="abwab-cards__title">
          <span class="abwab-cards__order">{{ node.orderValue }}</span>
          {{ node.name }}
        </div>
        <div class="abwab-cards__meta">
          {{ node.children.length > 0 ? node.liveChildCount : '' }}
        </div>
      </div>
    }
  </div>
</div>
