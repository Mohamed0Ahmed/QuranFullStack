<div class="abwab-toolbar">
  <div class="abwab-toolbar__controls qd-toolbar">
    <qd-abwab-search-controls
      class="abwab-toolbar__search abwab-search-controls--with-actions"
      [query]="searchQuery()"
      [matchCount]="searchMatchCount()"
      [results]="hideSectionControls() ? [] : searchResults()"
      [hideUnrelatedRoots]="hideUnrelatedRoots()"
      [helper]="searchScopeHint()"
      testIdPrefix="abwab-toolbar"
      (queryChanged)="searchQueryChanged.emit($event)"
      (hideUnrelatedRootsChanged)="hideUnrelatedRootsChanged.emit($event)"
      (resultSelected)="searchResultSelected.emit($event)"
    >
      @if (!hideSectionControls() && !searchOnly()) {
        <div abwabSearchActions class="abwab-toolbar__side-actions">
          @if (view() === 'tree') {
            <div class="abwab-toolbar__tree-expansion qd-toolbar__actions" role="group" [attr.aria-label]="treeExpansionGroupAriaLabel">
              <button
                type="button"
                qdAction="toolbar"
                [disabled]="!canCollapseTree()"
                [title]="treeCollapseAllLabel"
                [attr.aria-label]="treeCollapseAllLabel"
                data-testid="abwab-toolbar-tree-collapse-all"
                (click)="collapseAllRequested.emit()"
              >
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="m8 8-5-5m5 0v5H3M16 8l5-5m-5 0v5h5M8 16l-5 5m5 0v-5H3M16 16l5 5m-5 0v-5h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <span class="qd-sr-only">{{ treeCollapseAllLabel }}</span>
              </button>
            </div>
          }

          <div class="abwab-toolbar__view-toggle qd-toolbar__actions" role="group" [attr.aria-label]="viewToggleAriaLabel">
            <button
              type="button"
              qdAction="toolbar"
              class="abwab-toolbar__view-btn"
              [class.abwab-toolbar__view-btn--active]="view() === 'tree'"
              [attr.aria-pressed]="view() === 'tree'"
              [attr.aria-label]="treeViewLabel"
              [title]="treeViewLabel"
              data-testid="abwab-toolbar-view-tree"
              (click)="selectView('tree')"
            >
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 4v5M6 20v-4h12v4M6 16V9h12v7M3 4h6v5H3zM15 4h6v5h-6z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
              </svg>
              <span class="qd-sr-only">{{ treeViewLabel }}</span>
            </button>
            <button
              type="button"
              qdAction="toolbar"
              class="abwab-toolbar__view-btn"
              [class.abwab-toolbar__view-btn--active]="view() === 'cards'"
              [attr.aria-pressed]="view() === 'cards'"
              [attr.aria-label]="cardsViewLabel"
              [title]="cardsViewLabel"
              data-testid="abwab-toolbar-view-cards"
              (click)="selectView('cards')"
            >
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
              </svg>
              <span class="qd-sr-only">{{ cardsViewLabel }}</span>
            </button>
          </div>
        </div>
      }
    </qd-abwab-search-controls>
  </div>

  @if (!hideSectionControls() && !searchOnly()) {
    <qd-tabs class="abwab-toolbar__tabs" layout="tracks" [ariaLabel]="sectionTabsAriaLabel">
      <button
        type="button"
        qdTab
        [selected]="activeSectionId() === null"
        [attr.aria-label]="allDoorsCountAriaLabel"
        data-testid="abwab-toolbar-tab-all"
        (click)="selectSection(null)"
      >
        <span class="abwab-toolbar__tab-label">{{ allDoorsTabLabel }}</span>
        <span
          class="qd-tabs__count"
          [class.qd-tabs__count--empty]="totalRootCount() === 0"
          aria-hidden="true"
          [title]="allDoorsCountAriaLabel"
          data-testid="abwab-toolbar-tab-all-count"
        >{{ totalRootCount() }}</span>
      </button>
      @for (section of sections(); track section.id) {
        <button
          type="button"
          qdTab
          [selected]="activeSectionId() === section.id"
          [attr.aria-label]="sectionCountAriaLabel(section.name, section.id)"
          [attr.data-testid]="'abwab-toolbar-tab-' + section.id"
          (click)="selectSection(section.id)"
        >
          <span class="abwab-toolbar__tab-label" [title]="section.name">{{ section.name }}</span>
          <span
            class="qd-tabs__count"
            [class.qd-tabs__count--empty]="rootCountFor(section.id) === 0"
            aria-hidden="true"
            [title]="sectionCountAriaLabel(section.name, section.id)"
            [attr.data-testid]="'abwab-toolbar-tab-' + section.id + '-count'"
          >{{ rootCountFor(section.id) }}</span>
        </button>
      }
    </qd-tabs>
  }
</div>
