<div class="abwab-toolbar">
  @if (!hideSectionControls()) {
    <qd-tabs [ariaLabel]="sectionTabsAriaLabel" class="abwab-toolbar__tabs">
      <button
        type="button"
        qdTab
        [selected]="activeSectionId() === null"
        data-testid="abwab-toolbar-tab-all"
        (click)="selectSection(null)"
      >
        {{ allDoorsTabLabel }}
      </button>
      @for (section of sections(); track section.id) {
        <button
          type="button"
          qdTab
          [selected]="activeSectionId() === section.id"
          [attr.data-testid]="'abwab-toolbar-tab-' + section.id"
          (click)="selectSection(section.id)"
        >
          {{ section.name }}
        </button>
      }
    </qd-tabs>
  }

  <div class="abwab-toolbar__search">
    <input
      type="search"
      [attr.aria-label]="searchLabel"
      [placeholder]="searchPlaceholder"
      [value]="searchQuery()"
      data-testid="abwab-toolbar-search"
      (input)="onSearchInput($event)"
    />
  </div>

  @if (!hideSectionControls()) {
    <div class="abwab-toolbar__view-toggle" role="group" [attr.aria-label]="sectionTabsAriaLabel">
      <button
        type="button"
        class="abwab-toolbar__view-btn"
        [class.abwab-toolbar__view-btn--active]="view() === 'tree'"
        data-testid="abwab-toolbar-view-tree"
        (click)="selectView('tree')"
      >
        {{ treeViewLabel }}
      </button>
      <button
        type="button"
        class="abwab-toolbar__view-btn"
        [class.abwab-toolbar__view-btn--active]="view() === 'cards'"
        data-testid="abwab-toolbar-view-cards"
        (click)="selectView('cards')"
      >
        {{ cardsViewLabel }}
      </button>
    </div>
  }
</div>
