<a
  class="qd-card qd-interactive-surface word-section-card"
  [routerLink]="route()"
  data-testid="word-section-card"
>
  <div class="word-section-card__body">
    <p class="word-section-card__kicker">
      <span class="word-section-card__ordinal" aria-hidden="true">{{ ordinal() }}</span>
      <span class="word-section-card__eyebrow">{{ eyebrow() }}</span>
    </p>
    <h2 class="qd-card-title">{{ title() }}</h2>
    <p class="qd-text-muted word-section-card__desc">{{ description() }}</p>
  </div>
  <span class="word-section-card__arrow" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none">
      <path d="M19 12H5m7 7-7-7 7-7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </span>
</a>
