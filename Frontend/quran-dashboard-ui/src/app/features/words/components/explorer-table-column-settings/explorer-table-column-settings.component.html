<button
  #trigger
  type="button"
  qdAction="icon-only"
  size="sm"
  class="explorer-table-column-settings__trigger"
  aria-haspopup="dialog"
  [attr.aria-expanded]="panelOpen()"
  [attr.aria-controls]="panelOpen() ? panelId : null"
  aria-label="تخصيص أعمدة الجدول"
  title="تخصيص أعمدة الجدول"
  [attr.data-testid]="testIdPrefix() + '-columns-trigger'"
  (click)="togglePanel()"
>
  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6" />
    <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V21h-4v-.09A1.7 1.7 0 0 0 9 19.36a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.63 15a1.7 1.7 0 0 0-1.55-1.03H3v-4h.09A1.7 1.7 0 0 0 4.64 9a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.63h.01A1.7 1.7 0 0 0 10.03 3H14v.09A1.7 1.7 0 0 0 15 4.64a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.37 9v.01A1.7 1.7 0 0 0 21 10.03V14h-.09A1.7 1.7 0 0 0 19.4 15Z" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" />
  </svg>
</button>

@if (panelOpen()) {
  <section
    class="explorer-table-column-settings__panel"
    qdFloatingLayer="disclosure-popover"
    [anchorElement]="triggerElement"
    [controlElement]="triggerElement"
    [id]="panelId"
    role="dialog"
    tabindex="-1"
    aria-label="تخصيص أعمدة الجدول"
    [attr.data-testid]="testIdPrefix() + '-columns-panel'"
    (dismissed)="onDismissed($event)"
  >
    <header class="explorer-table-column-settings__header">
      <div>
        <h3 class="explorer-table-column-settings__title">أعمدة الجدول</h3>
        <p class="explorer-table-column-settings__hint">اختر الأعمدة ورتّبها كما تريد.</p>
      </div>
      <button
        type="button"
        qdAction="tertiary"
        size="sm"
        [attr.data-testid]="testIdPrefix() + '-columns-reset'"
        (click)="resetRequested.emit()"
      >
        استعادة الافتراضي
      </button>
    </header>

    <ul
      cdkDropList
      class="explorer-table-column-settings__list"
      [cdkDropListData]="columns()"
      (cdkDropListDropped)="drop($event)"
    >
      @for (column of columns(); track column.key; let index = $index) {
        <li cdkDrag [cdkDragDisabled]="column.reorderLocked" class="explorer-table-column-settings__item">
          <button
            cdkDragHandle
            type="button"
            qdAction="icon-only"
            size="sm"
            class="explorer-table-column-settings__drag"
            [disabled]="column.reorderLocked"
            [attr.aria-label]="'سحب عمود «' + column.label + '» لإعادة ترتيبه'"
            [title]="'إعادة ترتيب «' + column.label + '»'"
          >
            <span aria-hidden="true">⋮⋮</span>
          </button>

          <label class="qd-check-row explorer-table-column-settings__check">
            <input
              type="checkbox"
              class="qd-checkbox"
              [checked]="column.visible"
              [disabled]="column.locked"
              [attr.data-testid]="testIdPrefix() + '-column-' + column.key"
              (change)="onVisibilityChanged(column, $event)"
            />
            <span>{{ column.label }}</span>
          </label>

          <div class="explorer-table-column-settings__move-actions">
            <button
              type="button"
              qdAction="icon-only"
              size="sm"
              [disabled]="!canMoveUp(index)"
              [attr.aria-label]="'تحريك عمود «' + column.label + '» لأعلى'"
              [title]="'تحريك «' + column.label + '» لأعلى'"
              (click)="move(column, 'up')"
            >
              <span aria-hidden="true">↑</span>
            </button>
            <button
              type="button"
              qdAction="icon-only"
              size="sm"
              [disabled]="!canMoveDown(index)"
              [attr.aria-label]="'تحريك عمود «' + column.label + '» لأسفل'"
              [title]="'تحريك «' + column.label + '» لأسفل'"
              (click)="move(column, 'down')"
            >
              <span aria-hidden="true">↓</span>
            </button>
          </div>
        </li>
      }
    </ul>
  </section>
}
