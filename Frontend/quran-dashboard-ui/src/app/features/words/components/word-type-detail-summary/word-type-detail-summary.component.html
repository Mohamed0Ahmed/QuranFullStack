<section
  class="word-type-detail-summary"
  [attr.aria-label]="summaryLabel"
  data-testid="word-type-detail-summary"
>
  <p class="word-type-detail-summary__label" data-testid="word-type-detail-summary-label">{{ label() }}</p>

  <dl class="word-type-detail-summary__measures">
    <div class="word-type-detail-summary__measure" data-testid="word-type-detail-summary-measure">
      <dt class="word-type-detail-summary__measure-label">{{ headers.occurrences }}</dt>
      <dd class="word-type-detail-summary__measure-value">{{ occurrences() }}</dd>
    </div>
    <div class="word-type-detail-summary__measure" data-testid="word-type-detail-summary-measure">
      <dt class="word-type-detail-summary__measure-label">{{ headers.ayahs }}</dt>
      <dd class="word-type-detail-summary__measure-value">{{ ayahs() }}</dd>
    </div>
    <div class="word-type-detail-summary__measure" data-testid="word-type-detail-summary-measure">
      <dt class="word-type-detail-summary__measure-label">{{ headers.surahs }}</dt>
      <dd class="word-type-detail-summary__measure-value">{{ surahs() }}</dd>
    </div>
  </dl>
</section>
