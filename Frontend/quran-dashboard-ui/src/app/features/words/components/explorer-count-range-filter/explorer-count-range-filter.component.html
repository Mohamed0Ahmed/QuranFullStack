<details class="range-filter range-filter--cards" data-testid="explorer-count-range-filter">
  <summary class="range-filter__summary">
    <span class="range-filter__summary-label">{{ labels.sectionLabel }}</span>
    @if (activeCount() > 0) {
      <span class="range-filter__badge" data-testid="range-filter-active-count">{{ activeCount() }}</span>
    }
  </summary>

  <div class="range-filter__body">
    @for (metric of metrics(); track metric.key) {
      <div class="range-filter__metric" [attr.data-testid]="'range-filter-metric-' + metric.key">
        <span class="range-filter__metric-label">{{ metric.labelAr }}</span>

        <div class="range-filter__chips" role="group" [attr.aria-label]="metric.labelAr">
          @for (chip of chipsFor(metric); track chip.kind) {
            <button
              qdAction="toolbar"
              size="sm"
              type="button"
              class="qd-badge range-filter__chip"
              [class.qd-is-selected]="isChipActive(metric, chip)"
              [attr.aria-pressed]="isChipActive(metric, chip)"
              [disabled]="disabled()"
              [attr.data-testid]="'range-filter-chip-' + metric.key + '-' + chip.kind"
              (click)="onChipToggle(metric, chip)"
            >
              {{ chipLabel(chip) }}
            </button>
          }

          <button
            qdAction="toolbar"
            size="sm"
            type="button"
            class="qd-badge range-filter__chip"
            [class.qd-is-selected]="isCustomActive(metric)"
            [attr.aria-pressed]="isCustomActive(metric)"
            [disabled]="disabled()"
            [attr.data-testid]="'range-filter-custom-' + metric.key"
            (click)="onCustomToggle(metric)"
          >
            {{ labels.custom }}
          </button>
        </div>

        @if (isCustomActive(metric)) {
          <div class="range-filter__custom" data-testid="range-filter-custom-inputs">
            <label class="range-filter__custom-field">
              <span class="qd-sr-only">{{ metric.labelAr }} — {{ labels.min }}</span>
              <input
                qdControl
                type="number"
                inputmode="numeric"
                min="0"
                class="qd-input range-filter__custom-input"
                [attr.placeholder]="labels.min"
                [value]="draftMin(metric)"
                [disabled]="disabled()"
                [attr.data-testid]="'range-filter-min-' + metric.key"
                (input)="onMinDraft(metric, $any($event.target).value)"
                (keydown.enter)="onCustomCommit(metric, $event)"
                (keydown.escape)="onCustomRevert(metric)"
              />
            </label>
            <span class="range-filter__custom-sep" aria-hidden="true">–</span>
            <label class="range-filter__custom-field">
              <span class="qd-sr-only">{{ metric.labelAr }} — {{ labels.max }}</span>
              <input
                qdControl
                type="number"
                inputmode="numeric"
                min="0"
                class="qd-input range-filter__custom-input"
                [attr.placeholder]="labels.max"
                [value]="draftMax(metric)"
                [disabled]="disabled()"
                [attr.data-testid]="'range-filter-max-' + metric.key"
                (input)="onMaxDraft(metric, $any($event.target).value)"
                (keydown.enter)="onCustomCommit(metric, $event)"
                (keydown.escape)="onCustomRevert(metric)"
              />
            </label>
            <button
              qdAction="secondary"
              size="sm"
              type="button"
              class="qd-btn qd-btn-secondary range-filter__custom-apply"
              [disabled]="disabled()"
              [attr.aria-label]="labels.apply + ' — ' + metric.labelAr"
              [attr.data-testid]="'range-filter-apply-' + metric.key"
              (click)="onCustomCommit(metric)"
            >
              {{ labels.apply }}
            </button>
          </div>
        }
      </div>
    }

    @if (activeCount() > 0) {
      <button
        qdAction="secondary"
        size="sm"
        type="button"
        class="qd-btn qd-btn-secondary range-filter__clear"
        [disabled]="disabled()"
        data-testid="range-filter-clear-all"
        (click)="onClearAll()"
      >
        {{ labels.clearAll }}
      </button>
    }
  </div>
</details>
