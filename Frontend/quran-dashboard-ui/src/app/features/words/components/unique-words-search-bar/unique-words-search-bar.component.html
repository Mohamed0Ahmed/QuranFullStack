<div class="unique-words-search-bar" role="search">
  <label class="unique-words-search-bar__field">
    <span class="qd-sr-only">{{ searchLabel }}</span>
    <input
      class="qd-input"
      type="search"
      [value]="search()"
      [placeholder]="placeholder"
      [attr.aria-label]="searchLabel"
      data-testid="unique-words-search-input"
      (input)="onSearchInput($event)"
    />
  </label>

  <label class="unique-words-search-bar__field">
    <span class="unique-words-search-bar__label">{{ sortLabel }}</span>
    <select
      class="qd-select"
      [value]="sort()"
      [attr.aria-label]="sortLabel"
      data-testid="unique-words-sort-select"
      (change)="onSortChange($event)"
    >
      @for (option of sortOptions; track option.key) {
        <option [value]="option.key">{{ option.labelAr }}</option>
      }
    </select>
  </label>
</div>
