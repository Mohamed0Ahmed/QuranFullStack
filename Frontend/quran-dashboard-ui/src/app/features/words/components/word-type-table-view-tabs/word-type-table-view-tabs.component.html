<nav
  class="word-type-table-view-tabs"
  role="tablist"
  [attr.aria-label]="tabsLabel"
  #tabList
>
  @for (option of options; track option.value) {
    <button
      type="button"
      class="qd-tabs__tab word-type-table-view-tabs__tab"
      role="tab"
      [attr.aria-selected]="isSelected(option.value)"
      [attr.tabindex]="isSelected(option.value) ? 0 : -1"
      [attr.data-testid]="'word-type-table-view-tab--' + option.value"
      [class.qd-is-selected]="isSelected(option.value)"
      [disabled]="disabled()"
      (click)="selectView(option.value)"
      (keydown)="onTabKeydown($event, option.value)"
    >
      {{ option.label }}
    </button>
  }
</nav>
