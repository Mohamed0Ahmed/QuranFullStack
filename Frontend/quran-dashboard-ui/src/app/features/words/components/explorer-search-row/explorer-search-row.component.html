<label class="qd-explorer-search-row__main">
  <span class="qd-sr-only">{{ searchLabel() }}</span>
  <svg class="qd-explorer-search-row__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.6" />
    <path d="m16 16 4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
  </svg>
  <input
    qdControl
    type="search"
    inputmode="search"
    class="qd-input"
    [attr.placeholder]="searchPlaceholder()"
    [value]="searchValue()"
    [disabled]="disabled()"
    [attr.data-testid]="searchTestid()"
    (input)="searchChange.emit($any($event.target).value)"
  />
</label>

<ng-content></ng-content>
