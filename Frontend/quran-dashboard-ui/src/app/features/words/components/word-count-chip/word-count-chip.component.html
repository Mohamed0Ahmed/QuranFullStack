<button
  type="button"
  class="qd-badge word-count-chip"
  [class.word-count-chip--disabled]="disabled()"
  [class.qd-is-selected]="selected() && !disabled()"
  [attr.aria-label]="ariaLabel()"
  [attr.aria-disabled]="disabled()"
  [attr.aria-describedby]="disabled() ? disabledReasonId() : null"
  [attr.aria-pressed]="ariaPressed()"
  [disabled]="disabled()"
  data-testid="word-count-chip"
  (click)="onClick()"
>
  @if (showLabel() && !countFirst()) {
    <span class="word-count-chip__label">{{ label() }}</span>
  }
  <span class="word-count-chip__count">{{ count() }}</span>
  @if (showLabel() && countFirst()) {
    <span class="word-count-chip__label">{{ label() }}</span>
  }
</button>
