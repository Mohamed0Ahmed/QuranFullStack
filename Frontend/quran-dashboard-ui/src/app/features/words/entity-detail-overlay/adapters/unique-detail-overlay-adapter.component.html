@if (drilldownState().status === 'notFound') {
  <div class="qd-empty-state" role="status" data-testid="overlay-unique-not-found">
    {{ drilldownState().errorMessage || notFoundLabel }}
  </div>
} @else {
  <qd-word-drilldown-modal
    data-testid="overlay-unique-drilldown"
    [frameless]="true"
    [state]="drilldownState()"
    [parentFrame]="frame()"
    (viewChange)="onViewChange($event)"
    (ayahPageChange)="onAyahPageChange($event)"
    (retry)="onRetry()"
  />
}
