<qd-data-table
  class="phrase-context-occurrences-table qd-explorer-table"
  renderer="standard"
  [rows]="rows()"
  [rowId]="rowIdentity"
  ariaLabel="جدول آيات السياق المطابقة"
  bodyAriaLabel="آيات السياق المطابقة"
  [columnCount]="5"
  [totalRowCount]="totalCount()"
  [state]="busy() ? 'refreshing' : 'ready'"
  [rowHeight]="rowHeight"
  [compactRowHeight]="compactRowHeight"
  [selectable]="!busy()"
  [selected]="isRowSelected"
  scrollStateKey="words.phrases.context-occurrences"
  (rowSelected)="toggleRow($event)"
>
  <ng-template #headerTemplate>
    <div class="occurrence-table__cell occurrence-table__cell--selection qd-explorer-table__header-cell" role="columnheader">
      <input
        class="occurrence-table__checkbox"
        type="checkbox"
        [checked]="selection.allSelected()"
        [indeterminate]="selection.partiallySelected()"
        [disabled]="busy() || totalCount() === 0"
        aria-label="تحديد كل الآيات المطابقة"
        data-testid="phrase-context-select-all"
        (change)="toggleAll($event)"
        (click)="$event.stopPropagation()"
      />
    </div>
    <div class="occurrence-table__cell occurrence-table__cell--number qd-explorer-table__header-cell qd-explorer-table__header-cell--row-number" role="columnheader">م</div>
    <div class="occurrence-table__cell qd-explorer-table__header-cell" role="columnheader">السورة والآية</div>
    <div class="occurrence-table__cell occurrence-table__cell--number qd-explorer-table__header-cell" role="columnheader">الصفحة</div>
    <div class="occurrence-table__cell qd-explorer-table__header-cell" role="columnheader">نص الآية</div>
  </ng-template>

  <ng-template #rowTemplate let-row let-index="index">
    <div class="occurrence-table__cell occurrence-table__cell--selection qd-explorer-table__cell" role="cell">
      <input
        class="occurrence-table__checkbox"
        type="checkbox"
        [checked]="selection.isSelected(row.ayah.ayahId)"
        [disabled]="busy()"
        [attr.aria-label]="'تحديد الآية ' + row.ayah.verseKey"
        [attr.data-ayah-id]="row.ayah.ayahId"
        (change)="toggleAyah($event, row.ayah.ayahId)"
        (click)="$event.stopPropagation()"
      />
    </div>
    <div class="occurrence-table__cell occurrence-table__cell--number qd-explorer-table__cell qd-explorer-table__cell--row-number" role="cell">{{ rowNumber(index) }}</div>
    <div class="occurrence-table__cell occurrence-table__cell--location qd-explorer-table__cell" role="cell">
      <strong>{{ row.ayah.surahNameArabic }}</strong>
      <span>آية {{ row.ayah.ayahNumber }}</span>
    </div>
    <div class="occurrence-table__cell occurrence-table__cell--number qd-explorer-table__cell" role="cell">{{ row.ayah.pageFrom }}</div>
    <div class="occurrence-table__cell occurrence-table__cell--ayah qd-explorer-table__cell" role="cell">
      <a
        class="occurrence-table__ayah-link qd-interactive-surface"
        [qdAyahOverlayLink]="row.mushafTarget"
        [attr.aria-label]="'فتح الآية ' + row.ayah.verseKey + ' في المصحف'"
      >
        <qd-phrase-highlighted-ayah
          roleScheme="context"
          [words]="row.ayah.words"
          [compact]="true"
          [contextHighlights]="row.highlights"
        />
      </a>
    </div>
  </ng-template>

  <ng-template #compactRowTemplate let-row let-index="index">
    <div class="occurrence-table__compact">
      <input
        class="occurrence-table__checkbox"
        type="checkbox"
        [checked]="selection.isSelected(row.ayah.ayahId)"
        [disabled]="busy()"
        [attr.aria-label]="'تحديد الآية ' + row.ayah.verseKey"
        [attr.data-ayah-id]="row.ayah.ayahId"
        (change)="toggleAyah($event, row.ayah.ayahId)"
        (click)="$event.stopPropagation()"
      />
      <span class="occurrence-table__compact-number">{{ rowNumber(index) }}</span>
      <strong>{{ row.ayah.surahNameArabic }} · آية {{ row.ayah.ayahNumber }}</strong>
      <a
        class="occurrence-table__ayah-link qd-interactive-surface"
        [qdAyahOverlayLink]="row.mushafTarget"
        [attr.aria-label]="'فتح الآية ' + row.ayah.verseKey + ' في المصحف'"
      >
        <qd-phrase-highlighted-ayah
          roleScheme="context"
          [words]="row.ayah.words"
          [compact]="true"
          [contextHighlights]="row.highlights"
        />
      </a>
    </div>
  </ng-template>

</qd-data-table>
