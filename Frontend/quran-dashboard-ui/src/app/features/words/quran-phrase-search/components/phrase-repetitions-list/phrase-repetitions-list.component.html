<div
  class="phrase-repetitions-list"
  qdResultList
  listVariant="master"
  listLabel="العبارات القرآنية المتكررة"
>
  @for (item of items(); track item.variantId; let index = $index) {
    <div
      qdResultItem
      selectable
      [selected]="selectedVariantId() === item.variantId"
      [current]="selectedVariantId() === item.variantId"
      [position]="position(index)"
      [setSize]="totalCount()"
    >
      <button
        type="button"
        class="phrase-repetitions-list__row"
        [class.phrase-repetitions-list__row--selected]="selectedVariantId() === item.variantId"
        [attr.aria-label]="item.displayText + '، ' + item.occurrenceCount + ' موضعًا'"
        [disabled]="disabled()"
        (click)="phraseSelected.emit(item.variantId)"
      >
        <span class="phrase-repetitions-list__copy">
          <span class="phrase-repetitions-list__phrase" dir="rtl">{{ item.displayText }}</span>
          <span class="phrase-repetitions-list__support">
            {{ item.ayahCount }} آية · {{ item.surahCount }} سورة
          </span>
        </span>
        <strong class="phrase-repetitions-list__count">{{ item.occurrenceCount }} موضعًا</strong>
      </button>
    </div>
  }
</div>
