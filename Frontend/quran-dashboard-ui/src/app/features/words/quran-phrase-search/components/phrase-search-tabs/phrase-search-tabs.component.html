<qd-tabs
  class="phrase-search-tabs"
  dir="rtl"
  ariaLabel="أقسام البحث في القرآن"
  layout="tracks"
>
  @for (tab of tabs; track tab.key) {
    <a
      #activeLink="routerLinkActive"
      qdTab
      routerLinkActive
      [routerLink]="tab.route"
      [routerLinkActiveOptions]="{
        paths: 'exact',
        queryParams: 'ignored',
        matrixParams: 'ignored',
        fragment: 'ignored',
      }"
      [selected]="activeLink.isActive"
      panelId="phrase-search-route-panel"
      ariaCurrentWhenActive="page"
      (keydown.enter)="activateTab($event)"
      (keydown.space)="activateTab($event)"
    >
      {{ tab.label }}
    </a>
  }
</qd-tabs>
