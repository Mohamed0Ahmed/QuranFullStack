<div class="qd-page" qdSessionScrollState="words.viewport.hub" qdSessionScrollTarget="viewport">
  <div class="qd-page-shell words-hub-frame">
    <qd-words-local-nav activeSection="hub" />

    <div class="qd-page-header words-hub-header">
      <h1 class="qd-page-title" data-testid="words-hub-title">{{ title }}</h1>
      <p class="qd-text-muted words-hub-subtitle" data-testid="words-hub-subtitle">{{ subtitle }}</p>

      <p class="words-hub-chain" data-testid="words-hub-chain">
        @for (node of chain; track node.label) {
          <span class="words-hub-chain__node">{{ node.label }}</span>
          @if (node.connector) {
            <span class="words-hub-chain__sep" aria-hidden="true">{{ node.connector === 'arrow' ? '←' : '+' }}</span>
          }
        }
      </p>
    </div>

    <section class="qd-grid qd-grid--curriculum words-hub-grid" [attr.aria-label]="sectionsLabel">
      @for (card of cards; track card.key) {
        <qd-word-section-card
          [class.qd-grid__span-all]="$last"
          [attr.data-testid]="'words-hub-card--' + card.key"
          [ordinal]="card.ordinal"
          [eyebrow]="card.eyebrow"
          [title]="card.title"
          [description]="card.description"
          [route]="card.route"
        />
      }
    </section>
  </div>
</div>
