<button
  type="button"
  class="mushaf-word"
  [class.mushaf-word--marker]="word().isAyahMarker"
  [class.mushaf-word--highlighted-ayah]="isHighlightedAyahWord()"
  [class.mushaf-word--selected-word]="selectedWordLocation() === word().wordLocation"
  [class.mushaf-word--ayah-selection]="isSelectedAyah()"
  [class.mushaf-word--door-highlight]="doorHighlight() !== null"
  [attr.data-door-color-slot]="doorHighlight()?.colorSlot ?? null"
  [disabled]="word().isAyahMarker"
  [attr.aria-label]="interactionLabel()"
  [attr.aria-pressed]="selectionLabel() ? isSelectedAyah() : null"
  [attr.data-word-location]="word().wordLocation"
  [attr.data-is-marker]="word().isAyahMarker"
  (pointerdown)="onPointerDown($event)"
  (pointermove)="onPointerMove($event)"
  (pointerup)="onPointerEnd($event)"
  (pointercancel)="onPointerEnd($event)"
  (contextmenu)="onContextMenu($event)"
  (click)="onWordClick($event)"
>
  @if (doorHighlight() && !word().isAyahMarker) {
    <span
      class="mushaf-word__door-background"
      [style.--qd-mushaf-door-background]="doorBackground()"
      aria-hidden="true"
    ></span>
  }
  <span class="mushaf-word__text">{{ displayText() }}</span>
</button>
