@if (!entry()) {
  <qd-empty-state
    message="لا تتوفر ترجمة لهذه الآية من المصدر المحدد."
    testId="translation-empty"
  />
} @else {
  <article class="study-card qd-card" data-testid="translation-card">
    <div
      class="study-card__body"
      [attr.dir]="entry()!.direction"
      [innerHTML]="entry()!.text | safeHtml"
    ></div>
  </article>
}
