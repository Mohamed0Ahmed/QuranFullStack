@if (!entry()) {
  <qd-empty-state
    message="لا يتوفر تفسير لهذه الآية من المصدر المحدد."
    testId="tafsir-empty"
  />
} @else {
  <article class="study-card qd-card" data-testid="tafsir-card">
    @if (entry()!.coveredAyahCount > 1) {
      <p class="study-card__coverage" data-testid="grouped-coverage">
        يغطي هذا التفسير الآيات: {{ coverageAyahNumbers() }}
      </p>
    }
    <div
      class="study-card__body"
      [attr.dir]="entry()!.direction"
      [innerHTML]="entry()!.text | safeHtml"
    ></div>
  </article>
}
