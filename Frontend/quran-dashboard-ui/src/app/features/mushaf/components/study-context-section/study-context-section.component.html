<section
  class="study-context-section qd-scroll-stable"
  aria-label="سياق الدراسة"
  data-testid="study-context-section"
>
  @if (!selectedWordLocation() && !selectedVerseKey()) {
    <qd-empty-state
      message="اختر كلمة أو آية من المصحف لعرض سياق الدراسة."
      testId="study-context-empty"
    />
  } @else {
    <qd-selected-word-section
      [embedded]="true"
      [analysis]="wordAnalysis()"
      [loadState]="wordLoadState()"
      [selectedWordLocation]="selectedWordLocation()"
    />

    @if (selectedVerseKey()) {
      <div class="study-context-section__divider" role="separator"></div>

      <qd-selected-ayah-section
        [embedded]="true"
        [study]="ayahStudy()"
        [loadState]="ayahLoadState()"
        [similarAyahs]="similarAyahs()"
        [similarAyahsLoadState]="similarAyahsLoadState()"
        [mutashabihat]="mutashabihat()"
        [mutashabihatLoadState]="mutashabihatLoadState()"
        [activeTab]="activeAyahTab()"
        [selectedVerseKey]="selectedVerseKey()"
        [tafsirOptions]="tafsirOptions()"
        [translationOptions]="translationOptions()"
        [fullI3rabOptions]="fullI3rabOptions()"
        (tabChange)="ayahTabChange.emit($event)"
        (tafsirSourceChange)="tafsirSourceChange.emit($event)"
        (translationSourceChange)="translationSourceChange.emit($event)"
        (fullI3rabSourceChange)="fullI3rabSourceChange.emit($event)"
        (ayahNavigate)="ayahNavigate.emit($event)"
      />
    }
  }
</section>
