@if (barVisible()) {
  <div
    class="qd-nav-progress"
    [class.qd-nav-progress--done]="state() === 'done'"
    aria-hidden="true"
    data-testid="qd-nav-progress"
  >
    <span class="qd-nav-progress__segment"></span>
  </div>
}
<span class="qd-sr-only" role="status" data-testid="qd-nav-progress-status">{{
  statusMessage()
}}</span>
