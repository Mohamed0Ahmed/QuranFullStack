<nav class="qd-navbar" role="navigation" aria-label="التنقل الرئيسي">
  <div
    class="qd-navbar__background"
    [attr.inert]="locked() ? '' : null"
    [attr.aria-hidden]="locked() ? true : null"
  >
    <a class="qd-navbar__brand" routerLink="/" aria-label="المنهج القرآني، لوحة التحكم">
      <span class="qd-navbar__brand-mark" aria-hidden="true">م</span>
      <span class="qd-navbar__brand-copy">
        <strong>المنهج القرآني</strong>
        <small>إدارة البحث</small>
      </span>
    </a>

    @if (wide()) {
      <qd-app-navigation
        mode="desktop"
        [items]="desktopItems"
        [openMenuKey]="openMenuKey()"
        (menuToggled)="onTriggerClick($event)"
        (menuPointerEntered)="onMenuPointerEnter($event)"
        (menuPointerLeft)="onMenuPointerLeave($event)"
        (menuLinkActivated)="closeMenu($event)"
      />
    }

    <span class="qd-navbar__spacer"></span>

    @if (wide()) {
      <div class="qd-navbar__actions" aria-label="إجراءات المستخدم">
        <ng-container *ngTemplateOutlet="chromeActions" />
        <qd-app-navigation
          mode="desktop"
          [items]="actionItems()"
          [openMenuKey]="openMenuKey()"
          (menuToggled)="onTriggerClick($event)"
          (menuPointerEntered)="onMenuPointerEnter($event)"
          (menuPointerLeft)="onMenuPointerLeave($event)"
          (menuLinkActivated)="closeMenu($event)"
        />
      </div>
    }
  </div>

  @if (!wide()) {
    <button
      type="button"
      qdAction="tertiary"
      class="qd-navbar__menu-toggle"
      aria-haspopup="dialog"
      aria-label="القائمة"
      [attr.aria-expanded]="sheetOpen()"
      [attr.inert]="toggleInert() ? '' : null"
      data-testid="app-navigation-toggle"
      (click)="openSheet()"
    >
      <qd-nav-icon name="menu" />
    </button>
  }
</nav>

<qd-command-launcher
  [items]="allItems()"
  (requested)="openCommandLauncher()"
  (overlayStateChanged)="setCommandLauncherOpen($event)"
/>

<qd-modal-shell
  variant="form"
  titleText="القائمة"
  closeLabel="إغلاق"
  testIdPrefix="app-navigation-sheet"
  dialogTestId="app-navigation-sheet"
  [open]="sheetOpen()"
  [hasFooter]="false"
  (dismissed)="closeSheet()"
>
  <div class="qd-navbar__sheet-actions">
    <ng-container *ngTemplateOutlet="chromeActions" />
  </div>

  <qd-app-navigation mode="sheet" [items]="allItems()" (navigated)="closeSheet()" />
</qd-modal-shell>

<ng-template #chromeActions>
  <button
    type="button"
    qdAction="icon-only"
    class="qd-navbar__command-trigger"
    aria-label="الانتقال السريع"
    title="الانتقال السريع"
    (click)="openCommandLauncher()"
  >
    <qd-nav-icon name="search" />
    @if (wide()) {
      <kbd aria-hidden="true">Ctrl K</kbd>
    } @else {
      <span class="qd-navbar__action-label" aria-hidden="true">الانتقال السريع</span>
    }
  </button>

  @if (canUseLinking() || linkingAccessResolving()) {
    <button
      type="button"
      qdAction="icon-only"
      class="qd-navbar__linking-trigger"
      [class.qd-navbar__linking-trigger--active]="linkingItemCount() > 0"
      [attr.aria-label]="linkingWorkspaceAriaLabel()"
      [disabled]="linkingAccessResolving()"
      (click)="openLinkingWorkspace()"
    >
      <qd-nav-icon name="link" />
      <span class="qd-navbar__action-label" aria-hidden="true">مساحة الربط</span>
      @if (linkingItemCount() > 0) {
        <span class="qd-navbar__linking-count" aria-hidden="true">{{ linkingItemCount() }}</span>
      }
    </button>
  }

  <button
    type="button"
    qdAction="icon-only"
    class="qd-navbar__theme-toggle"
    [attr.aria-label]="isDark() ? 'الوضع الفاتح' : 'الوضع الداكن'"
    [attr.aria-pressed]="isDark() ? 'true' : 'false'"
    (click)="toggleTheme()"
  >
    @if (isDark()) {
      <qd-nav-icon name="sun" />
      <span class="qd-navbar__action-label" aria-hidden="true">الوضع الفاتح</span>
    } @else {
      <qd-nav-icon name="moon" />
      <span class="qd-navbar__action-label" aria-hidden="true">الوضع الداكن</span>
    }
  </button>

  @if (linkingAccessResolving()) {
    <button type="button" qdAction="icon-only" aria-label="جارٍ التحقق من الحساب" disabled>
      <qd-nav-icon name="user" />
      <span class="qd-navbar__action-label" aria-hidden="true">جارٍ التحقق…</span>
    </button>
  } @else if (isAuthenticated()) {
    <button
      type="button"
      qdAction="icon-only"
      aria-label="تسجيل الخروج"
      title="تسجيل الخروج"
      data-testid="nav-sign-out"
      (click)="signOut()"
    >
      <qd-nav-icon name="logout" />
      <span class="qd-navbar__action-label" aria-hidden="true">تسجيل الخروج</span>
    </button>
  } @else {
    <button
      type="button"
      qdAction="icon-only"
      aria-label="تسجيل الدخول"
      title="تسجيل الدخول"
      data-testid="nav-sign-in"
      (click)="signIn()"
    >
      <qd-nav-icon name="login" />
      <span class="qd-navbar__action-label" aria-hidden="true">تسجيل الدخول</span>
    </button>
  }
</ng-template>
