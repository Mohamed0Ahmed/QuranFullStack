<nav class="qd-navbar" role="navigation" aria-label="التنقل الرئيسي">
  <div
    class="qd-navbar__background"
    [attr.inert]="locked() ? '' : null"
    [attr.aria-hidden]="locked() ? true : null"
  >
    <a class="qd-navbar__brand" routerLink="/">
      <span class="qd-page-title">المنهج القرآني</span>
    </a>

    @if (wide()) {
      <qd-app-navigation
        mode="desktop"
        [items]="desktopItems"
        [openMenuKey]="openMenuKey()"
        (menuToggled)="onTriggerClick($event)"
        (menuPointerEntered)="onMenuPointerEnter($event)"
        (menuPointerLeft)="onMenuPointerLeave($event)"
        (menuLinkActivated)="closeMenu($event)"
      />
    }

    <span class="qd-navbar__spacer"></span>

    @if (wide()) {
      <div class="qd-navbar__actions" aria-label="إجراءات المستخدم">
        <ng-container *ngTemplateOutlet="chromeActions" />
        <qd-app-navigation
          mode="desktop"
          [items]="actionItems()"
          [openMenuKey]="openMenuKey()"
          (menuToggled)="onTriggerClick($event)"
          (menuPointerEntered)="onMenuPointerEnter($event)"
          (menuPointerLeft)="onMenuPointerLeave($event)"
          (menuLinkActivated)="closeMenu($event)"
        />
      </div>
    }
  </div>

  @if (!wide()) {
    <button
      type="button"
      qdAction="tertiary"
      class="qd-navbar__menu-toggle"
      aria-haspopup="dialog"
      aria-label="القائمة"
      [attr.aria-expanded]="sheetOpen()"
      [attr.inert]="toggleInert() ? '' : null"
      data-testid="app-navigation-toggle"
      (click)="openSheet()"
    >
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true" focusable="false">
        <path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
      </svg>
    </button>
  }
</nav>

<qd-modal-shell
  variant="form"
  titleText="القائمة"
  closeLabel="إغلاق"
  testIdPrefix="app-navigation-sheet"
  dialogTestId="app-navigation-sheet"
  [open]="sheetOpen()"
  [hasFooter]="false"
  (dismissed)="closeSheet()"
>
  <div class="qd-navbar__sheet-actions">
    <ng-container *ngTemplateOutlet="chromeActions" />
  </div>

  <qd-app-navigation mode="sheet" [items]="allItems()" (navigated)="closeSheet()" />
</qd-modal-shell>

<ng-template #chromeActions>
  @if (canUseLinking()) {
    <button
      type="button"
      qdAction="tertiary"
      class="qd-navbar__linking-trigger"
      [class.qd-navbar__linking-trigger--active]="linkingItemCount() > 0"
      [attr.aria-label]="linkingWorkspaceAriaLabel()"
      (click)="openLinkingWorkspace()"
    >
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true" focusable="false">
        <path
          d="M7.25 10.75 10.75 7.25M6 13H4.5a3.5 3.5 0 0 1 0-7h1.75m5.5 0h1.75a3.5 3.5 0 0 1 0 7H12"
          stroke="currentColor"
          stroke-width="1.4"
          stroke-linecap="round"
        />
      </svg>
      <span class="qd-navbar__linking-label" aria-hidden="true">مساحة الربط</span>
      @if (linkingItemCount() > 0) {
        <span class="qd-navbar__linking-count" aria-hidden="true">{{ linkingItemCount() }}</span>
      }
    </button>
  }

  <button
    type="button"
    qdAction="tertiary"
    class="qd-navbar__theme-toggle"
    [attr.aria-label]="isDark() ? 'الوضع الفاتح' : 'الوضع الداكن'"
    [attr.aria-pressed]="isDark() ? 'true' : 'false'"
    (click)="toggleTheme()"
  >
    @if (isDark()) {
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true" focusable="false">
        <circle cx="9" cy="9" r="3.5" stroke="currentColor" stroke-width="1.2" />
        <path
          d="M9 1v2M9 15v2M1 9h2M15 9h2M3.22 3.22l1.42 1.42M13.36 13.36l1.42 1.42M3.22 14.78l1.42-1.42M13.36 4.64l1.42-1.42"
          stroke="currentColor"
          stroke-width="1.2"
          stroke-linecap="round"
        />
      </svg>
    } @else {
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true" focusable="false">
        <path
          d="M15.1 10.2A6.5 6.5 0 0 1 7.8 2.9a6.5 6.5 0 1 0 7.3 7.3z"
          stroke="currentColor"
          stroke-width="1.2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    }
  </button>

  @if (isAuthenticated()) {
    <button type="button" qdAction="tertiary" data-testid="nav-sign-out" (click)="signOut()">
      تسجيل الخروج
    </button>
  } @else {
    <button type="button" qdAction="tertiary" data-testid="nav-sign-in" (click)="signIn()">
      تسجيل الدخول
    </button>
  }
</ng-template>
