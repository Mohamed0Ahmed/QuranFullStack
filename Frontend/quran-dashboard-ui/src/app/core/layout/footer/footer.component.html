<footer class="qd-footer">
  <div class="qd-footer__inner qd-footer-inner">
    <p class="qd-text-muted">المنهج القرآني © 2026</p>
    <p class="qd-text-meta">لوحة تحكم لتنظيم ومراجعة بيانات البحث القرآني</p>

    @switch (viewState) {
      @case ('loading') {
        <span
          class="health-indicator health-loading"
          role="status"
          aria-live="polite"
          aria-busy="true"
          data-testid="footer-health-loading"
        >
          جارٍ التحقق من الحالة...
        </span>
      }
      @case ('success') {
        <span
          class="health-indicator"
          [class]="healthClass"
          role="status"
          aria-live="polite"
          data-testid="footer-health"
        >
          <span class="health-dot" [class]="healthDotClass"></span>
          {{ healthLabel }}
          @if (databaseCheck) {
            <span class="health-check">
              <span class="health-dot" [class]="databaseDotClass"></span>
              {{ databaseLabel }}
            </span>
          }
        </span>
      }
      @case ('error') {
        <span
          class="health-indicator health-error"
          role="status"
          aria-live="polite"
          data-testid="footer-health-error"
        >
          <span>{{ errorMessage }}</span>
          <button
            type="button"
            qdAction="tertiary"
            size="sm"
            class="health-retry-btn"
            data-testid="footer-health-retry"
            (click)="retry()"
          >
            إعادة المحاولة
          </button>
        </span>
      }
    }
  </div>
</footer>
