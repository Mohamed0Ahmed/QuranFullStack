<div class="qd-shell">
  <a class="qd-skip-link" [href]="'#' + mainContentId" data-testid="qd-skip-link">
    تخطّي إلى المحتوى
  </a>

  <div class="qd-shell-viewport">
    <qd-nav-progress />
    <qd-top-navbar />

    <main
      [id]="mainContentId"
      class="qd-shell__main"
      tabindex="-1"
      [class.qd-shell-main--page-scroll]="pageScrollLayout()"
      [attr.inert]="shellOverlayOpen() ? '' : null"
      [attr.aria-hidden]="shellOverlayOpen() ? true : null"
    >
      <router-outlet />
    </main>
  </div>

  <qd-footer
    [attr.inert]="shellOverlayOpen() ? '' : null"
    [attr.aria-hidden]="shellOverlayOpen() ? true : null"
  />
</div>
