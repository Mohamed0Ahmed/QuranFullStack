<div
  #backdrop
  class="qd-context-menu__backdrop"
  [attr.data-testid]="backdropTestId()"
  (click)="dismissed.emit()"
></div>
<div
  #surface
  class="qd-context-menu"
  [qdFloatingLayer]="variant()"
  [anchorPoint]="position()"
  [dismissBoundaryElement]="backdrop"
  [attr.role]="variant() === 'action-menu' ? 'menu' : 'region'"
  [attr.tabindex]="variant() === 'disclosure-popover' ? -1 : null"
  [attr.aria-label]="menuAriaLabel()"
  [attr.data-testid]="menuTestId()"
  (dismissed)="dismissed.emit()"
>
  <ng-content />
</div>
