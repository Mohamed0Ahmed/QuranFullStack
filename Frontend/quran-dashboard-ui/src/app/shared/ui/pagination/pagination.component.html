@if (showPagination()) {
  <nav class="qd-pagination" [attr.aria-label]="ariaLabel()">
    <div class="qd-pagination__controls">
      <button
        type="button"
        class="qd-btn qd-btn-secondary qd-pagination__nav qd-pagination__nav--prev"
        data-testid="qd-pagination-prev"
        [attr.aria-label]="prevLabel"
        [disabled]="disabled() || currentPage() <= 1"
        (click)="selectPage(currentPage() - 1)"
      >
        <svg
          class="qd-pagination__nav-icon"
          width="16"
          height="16"
          viewBox="0 0 16 16"
          fill="none"
          aria-hidden="true"
          focusable="false"
        >
          <path
            d="M6 4L10 8L6 12"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <span class="qd-pagination__nav-text">{{ prevLabel }}</span>
      </button>

      <div class="qd-pagination__pages" role="group" [attr.aria-label]="pagesGroupLabel">
        @for (page of visiblePages(); track page) {
          <button
            type="button"
            class="qd-btn qd-pagination__page"
            [class.qd-btn-soft]="page === currentPage()"
            [class.qd-btn-ghost]="page !== currentPage()"
            [attr.data-testid]="'qd-pagination-page-' + page"
            [attr.aria-current]="page === currentPage() ? 'page' : null"
            [disabled]="disabled()"
            (click)="selectPage(page)"
          >
            {{ page }}
          </button>
        }

        <form class="qd-pagination__jump" novalidate (submit)="submitJump($event)">
          <label class="qd-sr-only" [attr.for]="jumpInputId">{{ jumpInputLabel }}</label>
          <input
            [id]="jumpInputId"
            class="qd-input qd-pagination__jump-input"
            type="number"
            inputmode="numeric"
            data-testid="qd-pagination-jump-input"
            [attr.placeholder]="jumpPlaceholder"
            [min]="1"
            [max]="lastPage()"
            [value]="jumpValue()"
            [disabled]="disabled()"
            [attr.aria-invalid]="jumpError() ? true : null"
            [attr.aria-describedby]="jumpError() ? jumpErrorId : null"
            (input)="onJumpInput($any($event.target).value)"
            (keydown)="onJumpKeydown($event)"
          />
          <button
            type="submit"
            class="qd-btn qd-btn-secondary qd-pagination__jump-submit"
            data-testid="qd-pagination-jump-submit"
            [disabled]="disabled() || !jumpSubmittable()"
          >
            {{ goLabel }}
          </button>
        </form>
      </div>

      <button
        type="button"
        class="qd-btn qd-btn-secondary qd-pagination__nav qd-pagination__nav--next"
        data-testid="qd-pagination-next"
        [attr.aria-label]="nextLabel"
        [disabled]="disabled() || currentPage() >= lastPage()"
        (click)="selectPage(currentPage() + 1)"
      >
        <svg
          class="qd-pagination__nav-icon"
          width="16"
          height="16"
          viewBox="0 0 16 16"
          fill="none"
          aria-hidden="true"
          focusable="false"
        >
          <path
            d="M10 4L6 8L10 12"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <span class="qd-pagination__nav-text">{{ nextLabel }}</span>
      </button>
    </div>

    <p
      [id]="jumpErrorId"
      class="qd-pagination__jump-error"
      [class.qd-pagination__jump-error--visible]="jumpError() !== null"
      role="status"
      aria-live="polite"
      data-testid="qd-pagination-jump-error"
    >
      {{ jumpError() }}
    </p>

    <p
      [id]="liveRegionId"
      class="qd-sr-only"
      role="status"
      aria-live="polite"
      data-testid="qd-pagination-live"
    >
      {{ rangeAnnouncement() }}
    </p>
  </nav>
}
