<div
  class="qd-tabs"
  [class.qd-tabs--vertical]="orientation() === 'vertical'"
  [class.qd-tabs--grid]="layout() === 'grid'"
  [class.qd-tabs--tracks]="layout() === 'tracks'"
  [class.qd-tabs--segmented]="segmented()"
  [id]="instanceId"
  role="tablist"
  [attr.aria-label]="ariaLabel()"
  [attr.aria-orientation]="orientation()"
>
  <ng-content></ng-content>
</div>
