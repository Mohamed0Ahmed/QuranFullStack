<section
  class="qd-details__shell"
  [class.qd-details__shell--entity]="variant() === 'entity'"
  [class.qd-details__shell--safety]="variant() === 'safety'"
  [class.qd-details__shell--action-rail]="variant() === 'action-rail'"
  [class.qd-details__shell--study]="variant() === 'study'"
  [class.qd-details__shell--overlay-body]="variant() === 'overlay-body'"
  [attr.aria-labelledby]="identity() ? identityId : null"
  [attr.data-testid]="testIdPrefix()"
>
  <header class="qd-details__header">
    <div class="qd-details__identity-zone">
      @if (identity()) {
        <h2 class="qd-details__identity qd-truncate" [id]="identityId" [attr.data-testid]="testIdPrefix() + '-identity'">
          {{ identity() }}
        </h2>
      }
      <ng-content select="[qdDetailsMetadata]" />
    </div>
    <div class="qd-details__actions">
      <ng-content select="[qdDetailsActions]" />
    </div>
  </header>

  @if (hasTabs()) {
    <div class="qd-details__tabs" [attr.data-testid]="testIdPrefix() + '-tabs'">
      <ng-content select="[qdDetailsTabs]" />
    </div>
  }

  <div
    class="qd-details__status"
    role="status"
    aria-live="polite"
    [id]="statusId"
    [attr.data-testid]="testIdPrefix() + '-status'"
  >
    <ng-content select="[qdDetailsStatus]" />
  </div>

  <div class="qd-details__body" [attr.data-testid]="testIdPrefix() + '-body'">
    @if (layout() === 'no-selection') {
      <p class="qd-details__no-selection" [attr.data-testid]="testIdPrefix() + '-no-selection'">
        {{ noSelectionMessage() }}
      </p>
    } @else {
      <ng-content />
    }
  </div>

  @if (hasFooter()) {
    <footer class="qd-details__footer" [attr.data-testid]="testIdPrefix() + '-footer'">
      <ng-content select="[qdDetailsFooter]" />
    </footer>
  }
</section>
