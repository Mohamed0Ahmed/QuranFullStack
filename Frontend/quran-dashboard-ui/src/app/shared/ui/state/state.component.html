@switch (variant()) {
  @case ('loading') {
    <div class="qd-loading-state" role="status" aria-live="polite" aria-busy="true" data-testid="qd-state-loading">
      <span>{{ message() }}</span>
    </div>
  }
  @case ('error') {
    <div class="qd-error-state" role="alert" data-testid="qd-state-error">
      <span>{{ message() }}</span>
      @if (actionLabel(); as label) {
        <button type="button" class="qd-btn qd-btn-secondary qd-state__action" data-testid="qd-state-action" (click)="action.emit()">
          {{ label }}
        </button>
      }
    </div>
  }
  @default {
    <div class="qd-empty-state" role="status" data-testid="qd-state-empty">
      <span>{{ message() }}</span>
    </div>
  }
}
