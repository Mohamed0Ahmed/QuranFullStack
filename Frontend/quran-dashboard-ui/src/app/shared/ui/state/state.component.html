@switch (variant()) {
  @case ('loading') {
    <qd-panel-skeleton
      shape="text"
      testId="qd-state-loading"
      [loadingLabel]="message()"
      [reserve]="reserve()"
    />
  }
  @case ('error') {
    <qd-error-state
      severity="write"
      testId="qd-state-error"
      actionTestId="qd-state-action"
      [message]="message()"
      [actionLabel]="actionLabel()"
      [reserve]="reserve()"
      (action)="action.emit()"
    />
  }
  @default {
    <qd-empty-state testId="qd-state-empty" [message]="message()" [reserve]="reserve()" />
  }
}
