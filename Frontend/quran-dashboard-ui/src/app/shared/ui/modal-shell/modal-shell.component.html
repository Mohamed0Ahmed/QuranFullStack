@if (open()) {
  <div
    class="qd-modal-shell__backdrop"
    [attr.data-testid]="testIdPrefix() + '-backdrop'"
    (pointerdown)="onBackdropPointerDown($event)"
    (mousedown)="onBackdropPointerDown($event)"
    (click)="onBackdropClick($event)"
  >
    <section
      class="qd-modal-shell"
      [class.qd-modal-shell--confirm]="variant() === 'confirm'"
      [class.qd-modal-shell--form]="variant() === 'form'"
      [class.qd-modal-shell--wide]="variant() === 'wide'"
      [class.qd-modal-shell--overlay]="variant() === 'overlay'"
      [style.--qd-modal-shell-wide-inline-size]="wideInlineSize()"
      [style.--qd-modal-shell-wide-block-size]="wideBlockSize()"
      [attr.role]="dialogRole()"
      aria-modal="true"
      dir="rtl"
      [attr.aria-labelledby]="titleId"
      [attr.aria-describedby]="describedById()"
      [attr.data-qd-modal-variant]="variant()"
      [attr.data-testid]="dialogTestId() ?? testIdPrefix()"
      [cdkTrapFocus]="trapEnabled()"
      (keydown.escape)="onEscape($event)"
    >
      <header class="qd-modal-shell__header" [class.qd-modal-shell__header--bare]="bareHeader()">
        <div
          class="qd-modal-shell__header-row"
          [class.qd-modal-shell__header-row--balanced]="balancedHeader()"
        >
          <div class="qd-modal-shell__header-lead">
            <ng-content select="[qdModalShellHeaderLead]" />
            <h2
              class="qd-modal-shell__title"
              [class.qd-sr-only]="!showTitle()"
              [id]="titleId"
              [attr.data-testid]="testIdPrefix() + '-title'"
            >
              {{ titleText() }}
            </h2>
          </div>
          <div class="qd-modal-shell__header-center">
            <ng-content select="[qdModalShellHeaderCenter]" />
          </div>
          <div class="qd-modal-shell__header-extra">
            <ng-content select="[qdModalShellHeaderExtra]" />
            @if (showClose()) {
              <button
                type="button"
                class="qd-modal-shell__close"
                qdAction="tertiary"
                [attr.data-testid]="testIdPrefix() + '-close'"
                (click)="onCloseClick()"
              >
                {{ closeLabel() }}
              </button>
            }
          </div>
        </div>
        <ng-content select="[qdModalShellHeaderSupport]" />
      </header>

      <div
        class="qd-modal-shell__body"
        [class.qd-modal-shell__body--flush]="flushBody()"
        [attr.data-testid]="testIdPrefix() + '-body'"
      >
        <ng-content />
      </div>

      @if (hasFooter()) {
        <footer class="qd-modal-shell__footer" [attr.data-testid]="testIdPrefix() + '-footer'">
          <ng-content select="[qdModalShellFooter]" />
        </footer>
      }
    </section>
  </div>
}
