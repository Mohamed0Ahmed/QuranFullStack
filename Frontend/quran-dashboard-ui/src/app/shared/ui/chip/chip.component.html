<ng-template #labelContent><ng-content></ng-content></ng-template>

<ng-template #labelAndCount>
  @if (labelIsButton()) {
    <button
      type="button"
      class="qd-chip__label qd-chip__label--clickable"
      [attr.aria-label]="labelAriaLabel()"
      [disabled]="disabled()"
      data-testid="qd-chip-label"
      (click)="onLabelClick($event)"
    >
      <ng-container [ngTemplateOutlet]="labelContent"></ng-container>
    </button>
  } @else {
    <span class="qd-chip__label"><ng-container [ngTemplateOutlet]="labelContent"></ng-container></span>
  }
  @if (count() !== null) {
    <span class="qd-chip__count" data-testid="qd-chip-count">{{ count() }}</span>
  }
</ng-template>

@if (removable()) {
  <span
    class="qd-chip qd-chip--pill qd-chip--static"
    [class.qd-chip--filter]="variant() === 'filter'"
    [class.qd-chip--taxonomy]="variant() === 'taxonomy'"
    [class.qd-chip--alias]="variant() === 'alias'"
    [class.qd-is-selected]="selected()"
    [class.qd-chip--disabled]="disabled()"
    data-testid="qd-chip"
  >
    <ng-container [ngTemplateOutlet]="labelAndCount"></ng-container>
    <button
      type="button"
      class="qd-chip__remove"
      [attr.aria-label]="removeAriaLabel()"
      [disabled]="disabled()"
      data-testid="qd-chip-remove"
      (click)="onRemoveClick($event)"
    >×</button>
  </span>
} @else if (elementType() === 'a') {
  <a
    class="qd-chip qd-chip--pill"
    [class.qd-chip--filter]="variant() === 'filter'"
    [class.qd-chip--taxonomy]="variant() === 'taxonomy'"
    [class.qd-chip--alias]="variant() === 'alias'"
    [class.qd-is-selected]="selected()"
    [class.qd-chip--disabled]="disabled()"
    [attr.href]="disabled() ? null : href()"
    [attr.tabindex]="disabled() ? -1 : null"
    [attr.aria-disabled]="disabled() ? 'true' : null"
    [attr.aria-current]="selected() ? 'true' : null"
    [attr.aria-label]="ariaLabel()"
    data-testid="qd-chip"
    (click)="onClick($event)"
  >
    <ng-container [ngTemplateOutlet]="labelAndCount"></ng-container>
  </a>
} @else {
  <button
    type="button"
    class="qd-chip qd-chip--pill"
    [class.qd-chip--filter]="variant() === 'filter'"
    [class.qd-chip--taxonomy]="variant() === 'taxonomy'"
    [class.qd-chip--alias]="variant() === 'alias'"
    [class.qd-is-selected]="selected()"
    [attr.aria-pressed]="selected()"
    [attr.aria-label]="ariaLabel()"
    [disabled]="disabled()"
    data-testid="qd-chip"
    (click)="onClick($event)"
  >
    <ng-container [ngTemplateOutlet]="labelAndCount"></ng-container>
  </button>
}
