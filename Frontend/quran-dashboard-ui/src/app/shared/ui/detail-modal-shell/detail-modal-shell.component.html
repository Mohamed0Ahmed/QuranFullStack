<qd-modal-shell
  variant="overlay"
  testIdPrefix="detail-modal"
  dialogTestId="detail-modal-shell"
  [open]="visibility() === 'open'"
  [titleText]="titleText()"
  [describedById]="countId"
  [showClose]="false"
  [hasFooter]="false"
  [returnFocus]="false"
  (dismissed)="closeRequested.emit()"
>
  <ng-container qdModalShellHeaderLead>
    @if (depth() > 1) {
      <button
        #backButton
        type="button"
        qdAction="tertiary"
        size="sm"
        class="detail-modal-shell__back"
        data-testid="detail-modal-back"
        (click)="backRequested.emit()"
      >
        <span class="detail-modal-shell__back-icon" aria-hidden="true">&#8594;</span>
        {{ backLabel() }}
      </button>
    }
    @if (kindLabel()) {
      <span class="detail-modal-shell__kind" data-testid="detail-modal-kind">{{ kindLabel() }}</span>
    }
  </ng-container>

  <ng-container qdModalShellHeaderExtra>
    <span
      class="detail-modal-shell__count"
      [class.detail-modal-shell__count--visible]="countText() !== ''"
      [id]="countId"
      data-testid="detail-modal-count"
      >{{ countText() }}</span
    >
    <button
      #closeButton
      type="button"
      qdAction="tertiary"
      size="sm"
      class="detail-modal-shell__close"
      data-testid="detail-modal-close"
      (click)="closeRequested.emit()"
    >
      {{ closeLabel() }}
    </button>
  </ng-container>

  <ng-content />

  <p class="qd-sr-only" role="status" aria-live="polite" data-testid="detail-modal-live-title">
    {{ titleText() }}
  </p>
  @if (statusMessage()) {
    <p class="qd-sr-only" role="status" aria-live="polite" data-testid="detail-modal-live-status">
      {{ statusMessage() }}
    </p>
  }
</qd-modal-shell>

@if (visibility() === 'closed') {
  <button
    #restoreButton
    type="button"
    class="detail-modal-shell__restore"
    dir="rtl"
    data-testid="detail-modal-restore"
    [attr.aria-label]="restoreAriaLabel()"
    (click)="restoreRequested.emit()"
  >
    {{ restoreLabel() }}
  </button>
}
