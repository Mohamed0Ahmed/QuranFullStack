<qd-modal-shell
  variant="confirm"
  dialogRole="alertdialog"
  [open]="open()"
  [titleText]="titleText()"
  [showClose]="false"
  [testIdPrefix]="testIdPrefix()"
  (dismissed)="cancel()"
>
  <ng-content />

  <div qdModalShellFooter class="qd-confirm-dialog__foot">
    <button
      type="button"
      class="qd-btn"
      [class.qd-btn-primary]="tone() === 'default'"
      [class.qd-confirm-dialog__confirm--danger]="tone() === 'danger'"
      [disabled]="busy() || confirmDisabled()"
      [attr.aria-busy]="busy() ? 'true' : null"
      [attr.data-testid]="testIdPrefix() + '-confirm'"
      (click)="confirm()"
    >
      {{ confirmLabel() }}
    </button>
    <button
      #cancelButton
      type="button"
      class="qd-btn qd-btn-ghost"
      [disabled]="busy()"
      [attr.data-testid]="testIdPrefix() + '-cancel'"
      (click)="cancel()"
    >
      {{ cancelLabel() }}
    </button>
  </div>
</qd-modal-shell>
