<qd-modal-shell
  variant="confirm"
  dialogRole="alertdialog"
  [open]="open()"
  [titleText]="titleText()"
  [showClose]="false"
  [testIdPrefix]="testIdPrefix()"
  (dismissed)="cancel()"
>
  <ng-content />

  <div qdModalShellFooter class="qd-confirm-dialog__foot">
    <button
      type="button"
      [qdAction]="tone() === 'danger' ? 'danger' : 'primary'"
      [busy]="busy()"
      [disabled]="busy() || confirmDisabled()"
      [attr.data-testid]="testIdPrefix() + '-confirm'"
      (click)="confirm()"
    >
      {{ confirmLabel() }}
    </button>
    <button
      #cancelButton
      type="button"
      qdAction="tertiary"
      [disabled]="busy()"
      [attr.data-testid]="testIdPrefix() + '-cancel'"
      (click)="cancel()"
    >
      {{ cancelLabel() }}
    </button>
  </div>
</qd-modal-shell>
